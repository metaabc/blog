<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf6ef">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G7H3M2VW8T"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-G7H3M2VW8T');
</script>
<title>作業佈置</title>
<style>
  :root{
    --bg:#f7f3ec; --card:#fffdf9; --line:#e9e1d4; --ink:#2c2620; --muted:#8b8274; --faint:#a99f8f;
    --sign-bg:#fdf1dd; --sign-fg:#9c6a14; --test-bg:#fde9ee; --test-fg:#a8244a; --exam-bg:#fde4d3; --exam-fg:#b4692b;
    --accent:#2f6fb0;
    --fz:1;
    --shadow:0 1px 2px rgba(63,50,32,.05), 0 6px 18px -10px rgba(63,50,32,.22);
    --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  /* 字型大小設定（設定面板可選 小/中/大） */
  body[data-fz="s"]{ --fz:.88 }
  body[data-fz="l"]{ --fz:1.16 }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1100px 480px at 12% -8%, #fff9ec 0%, rgba(255,249,236,0) 62%),
      radial-gradient(900px 420px at 92% 4%, #eef5f4 0%, rgba(238,245,244,0) 58%),
      var(--bg);
    color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.6;
    padding-bottom:calc(158px + env(safe-area-inset-bottom));
  }

  /* ---------- 開關（簽改/測） ---------- */
  .toggle{display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;
    font-size:12.5px;font-weight:600;color:#5d564c;user-select:none;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .toggle input{appearance:none;width:30px;height:17px;border-radius:999px;background:#ded5c6;
    position:relative;cursor:pointer;transition:background .18s;margin:0;flex:0 0 auto}
  .toggle input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;
    border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .toggle input:checked{background:var(--accent)}
  .toggle input:checked::after{transform:translateX(13px)}

  /* 簽改/測 開關：浮於底部工具條上方（基礎樣式見上方的 .toggle） */

  /* ---------- 內容 ---------- */
  main.wrap{max-width:1020px;margin:0 auto;padding:0 20px}
  .srcbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:5px 0 12px;padding:9px 13px;
    background:rgba(255,253,249,.72);border:1px solid var(--line);border-radius:12px;
    font-size:12.5px;color:var(--muted)}
  .srcbar-links{display:flex;gap:8px;flex-wrap:wrap}
  .srcbar-links a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
    color:var(--accent);background:#fff;border:1px solid #dfe6ee;border-radius:999px;
    padding:2px 10px;font-weight:600;font-size:12.5px}
  .srcbar-links a:hover{background:#f2f7fc}
  .srcbar-links a svg{opacity:.7}
  .srcbar .law{margin-left:0;color:#9a9082;font-weight:500;white-space:normal}
  .srcbar-top{display:flex;align-items:center;gap:10px;width:100%}

  /* 頁面內的呈現方式切換（隨手可切，不必進設定；靠右） */
  .layswitch{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:2px;flex:0 0 auto;margin-left:auto}
  .layswitch button{border:0;background:transparent;font-family:inherit;cursor:pointer;
    font-size:12.5px;font-weight:600;color:#6d6459;padding:4px 12px;border-radius:999px;line-height:1.4;
    transition:background .15s,color .15s,transform .1s}
  .layswitch button.on{background:var(--accent);color:#fff}
  .layswitch button:active{transform:scale(.96)}

  /* 簽改/測 浮動開關：位於底部工具條上方約兩行處（靠右） */
  .signfilter{position:fixed;right:12px;z-index:48;
    bottom:calc(var(--mbar-h, 86px) + 48px);
    padding:7px 13px;border-radius:999px;font-size:13px;
    background:rgba(255,253,249,.97);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 7px 20px -12px rgba(60,48,32,.8),0 1px 2px rgba(60,48,32,.07);
    transition:box-shadow .16s,transform .12s}
  .signfilter:active{transform:scale(.97)}

  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
    animation:rise .3s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .body{padding:13px 16px 12px;min-width:0}
  /* 當天作業：日期高亮 */
  .day.today{border-color:color-mix(in srgb,var(--accent) 55%, var(--line));
    box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 55%, transparent), var(--shadow)}
  .day.today .hd h2{color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%, #fff);
    padding:2px 9px;border-radius:8px;display:inline-block}
  /* 測驗清單點項目後，跳轉到該日功課的高亮 */
  .day.flash{animation:flash 1.6s ease both}
  @keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%, transparent)}
    35%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%, transparent), var(--shadow)}
    100%{box-shadow:var(--shadow)}}

  /* 卡片 / 科目群組 右下角的分享鈕 */
  .dfoot,.sg-foot{display:flex;justify-content:flex-end;margin-top:9px}
  .sg-foot{margin-top:7px}
  .share-btn{display:inline-flex;align-items:center;gap:5px;
    padding:5px 12px;border-radius:999px;cursor:pointer;
    font-size:12.5px;font-weight:700;letter-spacing:.02em;
    color:var(--accent);background:color-mix(in srgb,var(--accent) 9%, #fff);
    border:1px solid color-mix(in srgb,var(--accent) 32%, #fff);
    transition:background .14s,transform .1s}
  .share-btn:hover{background:color-mix(in srgb,var(--accent) 16%, #fff)}
  .share-btn:active{transform:scale(.96)}
  .share-btn svg{flex:0 0 auto}

  /* ---------- 科目分組佈局（整週功課按科目歸類） ---------- */
  .subj-group{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .sg-head{display:flex;align-items:center;gap:8px;padding:11px 16px 10px;border-bottom:1px solid var(--line)}
  .sg-count{font-size:12px;color:var(--muted);font-weight:600;margin-left:auto}
  .sg-items{padding:9px 16px 12px}
  .sg-items li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
  .dtag{font-size:11.5px;font-weight:700;color:var(--muted);background:#f1ece2;
    border-radius:6px;padding:1px 7px;white-space:nowrap}
  .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .hd h2{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
  .chip{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;line-height:1.6;
    border:1px solid transparent}
  .chip.sign{background:var(--sign-bg);color:var(--sign-fg)}
  .chip.test{background:var(--test-bg);color:var(--test-fg)}
  .chip.today{background:var(--accent);color:#fff;font-weight:700}
  .chip.due{margin-left:auto;background:#f2eee6;color:#6b6357;font-weight:500}
  .chip.due.soon{background:color-mix(in srgb,var(--accent) 12%,#fff);color:var(--accent)}
  .chip.due.late{background:#f0ece4;color:#b0a696}

  ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.items li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
  .subj{font-size:12.5px;font-weight:700;line-height:1.6;padding:1px 8px;border-radius:6px;
    white-space:nowrap;border:1px solid;letter-spacing:.01em;margin-top:2px;min-width:38px;text-align:center}
  .txt{font-size:15.5px;line-height:1.72;color:#332d26;word-break:break-word;white-space:pre-line}
  li.note{grid-template-columns:1fr;color:var(--muted);font-size:13.5px;
    padding-bottom:2px;border-bottom:1px dotted #ebe4d8;margin-bottom:2px}
  li.note a.img{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid #cfe0ef}
  mark.k-sign{background:var(--sign-bg);color:var(--sign-fg);border-radius:4px;padding:0 3px;font-weight:700}
  mark.k-test{background:var(--test-bg);color:var(--test-fg);border-radius:4px;padding:0 3px;font-weight:700}
  mark.k-exam{background:var(--exam-bg);color:var(--exam-fg);border-radius:4px;padding:0 3px;font-weight:700}
  .chip.exam{background:var(--exam-bg);color:var(--exam-fg)}
  .srctag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:12px;font-weight:700;
    color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,#fff);border:1px solid color-mix(in srgb,var(--accent) 30%,#fff);
    vertical-align:middle;white-space:nowrap}
  a.srctag{text-decoration:none}
  a.srctag:hover{background:color-mix(in srgb,var(--accent) 22%,#fff)}

  /* ---------- 舊月曆格線（已停用）：標示哪天有 簽改 / 測驗 / 考試 ---------- */
  .cal-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(284px,1fr));gap:14px}
  .cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;
    box-shadow:0 10px 24px -18px rgba(60,48,32,.55);animation:rise .26s ease both}
  .cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:15px;font-weight:800;color:var(--ink);margin-bottom:9px;letter-spacing:.02em}
  .cal-ref{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.04em;white-space:nowrap}
  .cal-foot{display:flex;justify-content:flex-end;margin-top:10px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{margin-bottom:5px}
  .cal-dow span{text-align:center;font-size:11px;font-weight:700;color:var(--faint)}
  .cal-cell{position:relative;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    border-radius:9px;background:#faf7f1;border:1px solid #f0e9dc;padding:4px 3px 5px;overflow:hidden}
  .cal-cell.empty{background:transparent;border:0}
  .cal-cell.has{background:color-mix(in srgb,var(--exam-bg) 38%,#fff)}
  .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset;background:color-mix(in srgb,var(--accent) 8%,#fff)}
  .cal-d{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.4}
  .cal-cell.today .cal-d{color:var(--accent)}
  .cal-items{display:flex;flex-direction:column;gap:2px;margin-top:3px;width:100%;align-items:center}
  .ci{font-size:9px;line-height:1.3;padding:1px 5px;border-radius:5px;font-weight:700;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ci.test{background:var(--test-bg);color:var(--test-fg)}
  .ci.exam{background:var(--exam-bg);color:var(--exam-fg)}
  .ci.sign{background:var(--sign-bg);color:var(--sign-fg)}
  @media (max-width:560px){
    .cal-wrap{grid-template-columns:1fr}
  }

  /* 今日之後的測驗：逐句列出 */
  .cal-list{margin:4px 2px 14px;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 6%,var(--card)),var(--card));
    padding:12px 14px;box-shadow:0 10px 24px -20px rgba(60,48,32,.5)}
  .cal-list-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:13px;font-weight:800;color:var(--ink);margin-bottom:8px;letter-spacing:.02em}
  .cal-li{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}
  .cal-li:first-of-type{border-top:0}
  .cl-d{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--accent);white-space:nowrap}
  .cl-c{font-size:13px;color:var(--ink);line-height:1.45}
  .cl-c.test{color:var(--test-fg)}
  .cl-c.exam{color:var(--exam-fg);font-weight:700}
  .cl-subj{color:var(--ink);margin-right:4px}
  .cl-due{color:var(--faint);font-weight:600;margin-left:2px}
  .cal-list-empty{font-size:13px;color:var(--faint);text-align:center;padding:14px}
  .ci.cal-tap{cursor:pointer;transition:transform .12s,filter .12s}
  .ci.cal-tap:hover{filter:brightness(.94);transform:translateY(-1px)}
  .cal-li.cal-tap{cursor:pointer;border-radius:8px;padding-left:6px;margin-left:-6px;transition:background .12s}
  .cal-li.cal-tap:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .cal-li.past .cl-c{opacity:.72}
  .cl-past{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#b0a696;
    border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle;letter-spacing:.04em}
  .cal-rm{flex:0 0 auto;align-self:flex-start;margin-left:auto;
    width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:var(--muted);cursor:pointer;font-size:12px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background .14s,color .14s,border-color .14s,transform .1s}
  .cal-rm:hover{background:#fbeeef;color:#a8244a;border-color:#e6b8c0}
  .cal-rm:active{transform:scale(.9)}
  .cal-restore{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
  .cal-restore button{border:1px solid var(--line);background:#fff;color:#6d6459;font-family:inherit;
    font-size:12px;font-weight:600;border-radius:999px;padding:3px 12px;cursor:pointer;transition:transform .1s}
  .cal-restore button:active{transform:scale(.96)}

  .empty{text-align:center;color:var(--faint);font-size:14px;padding:52px 20px;
    border:1px dashed #ddd3c2;border-radius:16px;background:rgba(255,253,249,.6)}

  .toast{position:fixed;left:50%;bottom:calc(var(--mbar-h, 86px) + 62px);z-index:70;
    transform:translate(-50%,14px);opacity:0;pointer-events:none;
    background:#2b2620;color:#fff;font-size:13px;line-height:1.5;
    padding:9px 16px;border-radius:10px;max-width:86vw;text-align:center;
    transition:opacity .2s,transform .2s;box-shadow:0 8px 24px -12px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:#8c2b2b}

  /* ---------- 底部工具條 ---------- */
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(255,253,249,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:7px 20px calc(7px + env(safe-area-inset-bottom))}
  .mbar-inner{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:3px}
  .brow{display:flex;align-items:center;gap:10px}

  /* 設定（左，Apple 工具列樣式：圓角圖示 + 下方標籤） */
  .tb-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;
    border:0;background:transparent;cursor:pointer;font-family:inherit;
    padding:1px 4px;border-radius:12px;-webkit-tap-highlight-color:transparent}
  .tb-btn .ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb, var(--accent) 13%, #fff);color:var(--accent);
    transition:background .15s,transform .12s}
  .tb-btn:hover .ico{background:color-mix(in srgb, var(--accent) 20%, #fff)}
  .tb-btn:active .ico{transform:scale(.93)}
  .tb-btn .lbl{font-size:11px;font-weight:600;color:#6d6459;line-height:1.25;letter-spacing:.02em}

  /* 已設定班級（右）：可橫向滑動 */
  .cstrip{flex:0 1 auto;min-width:0;margin-left:auto;display:flex;align-items:center;gap:6px;padding:1px 0;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;overscroll-behavior-x:contain}
  .cstrip::-webkit-scrollbar{display:none}
  .cchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:800;color:#6d6459;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:9px 14px;line-height:1.2;
    white-space:nowrap;scroll-snap-align:center;
    transition:background .16s,color .16s,border-color .16s,box-shadow .16s}
  .cchip .cdot{width:6px;height:6px;border-radius:50%;background:var(--c);flex:0 0 auto}
  .cchip .cnow{font-size:11px;font-weight:800;line-height:1.75;border-radius:8px;
    padding:0 6px;background:var(--c);color:#fff}
  .cchip[aria-selected="true"]{color:#fff;background:var(--c);border-color:transparent;
    box-shadow:0 5px 14px -9px rgba(0,0,0,.85)}
  .cchip[aria-selected="true"] .cdot{background:#fff}
  .cchip[aria-selected="true"] .cnow{background:#fff;color:var(--c)}
  .cchip.busy{opacity:.65}

  /* 手勢滑動切班 / 切呈現：禁止瀏覽器在內文上做水平平移與雙指縮放，
     讓單指水平滑（切呈現）與雙指滑（切班級）完全由 JS 控制；垂直仍可原生捲動 */
  main.wrap{will-change:transform;touch-action:pan-y}
  body.dragging{user-select:none;-webkit-user-select:none}

  /* ---------- 班級選單（底部彈出） ---------- */
  .sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
  .sheet-wrap.on{display:block}
  .backdrop{position:absolute;inset:0;background:rgba(40,32,22,.4);animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;
    background:#fffdf9;border-radius:18px 18px 0 0;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:80vh;overflow:auto;animation:up .22s ease;box-shadow:0 -10px 40px -18px rgba(0,0,0,.4)}
  @keyframes up{from{transform:translateY(16px);opacity:.7}to{transform:none;opacity:1}}
  .sheet-hd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .sheet-hd h3{margin:0;font-size:16px}
  .sheet-hd .grab{width:36px;height:4px;border-radius:99px;background:#ded5c6;margin:0 auto 8px}
  .sheet-hd .done{margin-left:auto;border:0;background:#eee7db;color:#5d564c;font-family:inherit;
    font-size:13.5px;font-weight:700;border-radius:999px;padding:7px 16px;cursor:pointer}
  .sheet .tip{margin:2px 0 12px;font-size:12.5px;color:var(--faint);line-height:1.6}
  .grp{margin-bottom:12px}
  .grp .lab{font-size:12.5px;font-weight:700;color:#8b8274;letter-spacing:.04em;margin:0 0 6px 2px}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .opt{cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:#5d564c;
    background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 6px;
    display:flex;align-items:center;justify-content:center;gap:5px;
    transition:background .15s,color .15s,border-color .15s}
  .opt[aria-pressed="true"]{color:#fff;border-color:transparent;font-weight:700}
  .opt .tick{font-size:11px;opacity:.9}
  .sheet .foot{margin-top:6px;font-size:12px;color:var(--faint)}

  @media (max-width:560px){
    main.wrap{padding:0 12px}
    .toggle{font-size:12px;padding:5px 9px;gap:6px}
    .srcbar{margin:10px 0;padding:8px 11px;gap:7px}
    .srcbar .law{margin-left:0;flex:1 1 auto;white-space:normal;font-size:12px}
    .srcbar-links{gap:6px}
    .srcbar-links a{padding:2px 9px;font-size:12px}
    .layswitch button{padding:3px 9px;font-size:12px}
    .body{padding:13px}
    .txt{font-size:15px}
    .mbar{padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
    .cchip{font-size:15px;padding:9px 14px}
  }
  @media print{
    body{background:#fff;padding:0}
    .srcbar,.mbar,.toast,.sheet-wrap,.fab,.signfilter{display:none}

<script>
/* =========================================================
   資料來源
   ========================================================= */
const URL_BASE = "https://webservice.pooito.edu.mo/show.php?group=function/homeworks/showworks.php&all=true&&classcode=";

/* 可選班級：value = 網址 classcode，name = 顯示名稱 */
const CLASSES = [
  { v:"s6A", n:"高三A" }, { v:"s6B", n:"高三B" }, { v:"s6C", n:"高三C" }, { v:"s6D", n:"高三D" },
  { v:"s5A", n:"高二A" }, { v:"s5B", n:"高二B" }, { v:"s5C", n:"高二C" }, { v:"s5D", n:"高二D" },
  { v:"s4A", n:"高一A" }, { v:"s4B", n:"高一B" }, { v:"s4C", n:"高一C" }, { v:"s4D", n:"高一D" },
  { v:"s3A", n:"初三A" }, { v:"s3B", n:"初三B" }, { v:"s3C", n:"初三C" }, { v:"s3D", n:"初三D" }, { v:"s3E", n:"初三E" },
  { v:"s2A", n:"初二A" }, { v:"s2B", n:"初二B" }, { v:"s2C", n:"初二C" }, { v:"s2D", n:"初二D" }, { v:"s2E", n:"初二E" },
  { v:"s1A", n:"初一A" }, { v:"s1B", n:"初一B" }, { v:"s1C", n:"初一C" }, { v:"s1D", n:"初一D" }, { v:"s1E", n:"初一E" }
];
const LEVELS = [
  { k:"s6", t:"高三" }, { k:"s5", t:"高二" }, { k:"s4", t:"高一" },
  { k:"s3", t:"初三" }, { k:"s2", t:"初二" }, { k:"s1", t:"初一" }
];
const LEVEL_ACCENT = { s6:"#6d5bd0", s5:"#0e7490", s4:"#b4692b", s3:"#2f6fb0", s2:"#b3457a", s1:"#0e8a7d" };
const MAX_SEL = 6;
const DEFAULT_SEL = ["s3C", "s1A"];
const LAYOUTS = [
  { k:"card", t:"作業" },
  { k:"tests", t:"測驗" },
  { k:"subject", t:"科目" }
];
const LS_LAYOUT = "hw_layout_v1";
const LS_FONT = "hw_font_v1";
const FONT_SIZES = [
  { k:"s", t:"小" },
  { k:"m", t:"中" },
  { k:"l", t:"大" }
];

const accentOf = code => LEVEL_ACCENT[String(code).slice(0, 2)] || "#2f6fb0";
const nameOf = code => (CLASSES.find(c => c.v === code) || {}).n || code;

/* =========================================================
   小工具
   ========================================================= */
const p2 = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const parseD = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const today0 = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const stamp = () => { const d = new Date(); return ymd(d) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()); };
const mmdd = s => { const d = parseD(s); return p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
const sleep = ms => new Promise(r => setTimeout(r, ms));

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* 安全解碼 HTML 實體：只用字串替換，絕不調用 innerHTML / new Function /
   DOMParser，因此抓取到的網頁內容永遠不會被當成標記或程式碼來解析或執行。 */
const ENT_MAP = {
  "&amp;":"&", "&lt;":"<", "&gt;":">", "&quot;":'"', "&apos;":"'",
  "&nbsp;":" ", "&copy;":"©", "&reg;":"®", "&trade;":"™",
  "&deg;":"°", "&plusmn;":"±", "&times;":"×", "&divide;":"÷",
  "&middot;":"·", "&hellip;":"…", "&mdash;":"—", "&ndash;":"–",
  "&laquo;":"«", "&raquo;":"»", "&lsquo;":"‘", "&rsquo;":"’",
  "&ldquo;":"“", "&rdquo;":"”", "&bull;":"•", "&euro;":"€",
  "&pound;":"£", "&yen;":"¥", "&curren;":"¤", "&sect;":"§",
  "&frac12;":"½", "&frac14;":"¼", "&frac34;":"¾", "&sup2;":"²",
  "&#39;":"'", "&#x27;":"'", "&#x2F;":"/", "&#96;":"`"
};
function decodeEnt(s){
  return String(s == null ? "" : s).replace(/&(?:#x?[0-9a-fA-F]+|[a-zA-Z][a-zA-Z0-9]*);/g, m => {
    if (ENT_MAP[m]) return ENT_MAP[m];
    const num = m.match(/^&#(x?)([0-9a-fA-F]+);$/);
    if (num){
      const cp = num[1] ? parseInt(num[2], 16) : parseInt(num[2], 10);
      if (Number.isFinite(cp) && cp > 0 && cp <= 0x10FFFF){
        try { return String.fromCodePoint(cp); } catch(e){}
      }
    }
    return m;            // 不認識的實體原樣保留，絕不當成標記執行
  });
}

function toast(msg, isErr){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = "toast" + (isErr ? " err" : ""); }, 3600);
}


/* =========================================================
   儲存：已選班級 / 各班快取
   ========================================================= */
const LS_SEL = "hw_sel_v1";
const LS_CACHE = "hw_cache_v1";
const CACHE_MIN = 5;          // 資料快取有效分鐘數：5 分鐘內開頁直接顯示、不重抓

/* 一律按「高班 → 低班」排列（CLASSES 的既定次序），左右亦以此為準 */
const sortSel = arr => arr.slice()
  .sort((a, b) => CLASSES.findIndex(x => x.v === a) - CLASSES.findIndex(x => x.v === b));

function loadSel(){
  try{
    const a = JSON.parse(localStorage.getItem(LS_SEL) || "null");
    if (Array.isArray(a) && a.length){
      const ok = a.filter(c => CLASSES.some(x => x.v === c));
      if (ok.length) return sortSel(ok.slice(0, MAX_SEL));
    }
  }catch(e){}
  return sortSel(DEFAULT_SEL);
}
function saveSel(){ try{ localStorage.setItem(LS_SEL, JSON.stringify(state.sel)); }catch(e){} }

function loadLayout(){
  try{
    const v = localStorage.getItem(LS_LAYOUT);
    if (v && LAYOUTS.some(l => l.k === v)) return v;
  }catch(e){}
  return "card";
}

function loadFont(){
  try{
    const v = localStorage.getItem(LS_FONT);
    if (v && FONT_SIZES.some(f => f.k === v)) return v;
  }catch(e){}
  return "m";
}
function applyFont(){ document.body.dataset.fz = state.font; }

function loadCache(){
  try{
    const o = JSON.parse(localStorage.getItem(LS_CACHE) || "null");
    if (o && typeof o === "object") return o;
  }catch(e){}
  return {};
}
function saveCache(){ try{ localStorage.setItem(LS_CACHE, JSON.stringify(state.data)); }catch(e){} }

/* 已隱藏（手動移除）的已過測驗：按班級 + 項目特徵記住，重新抓資料也不會再出現 */
const LS_DISMISS = "hw_dismiss_v1";
let DISMISS = loadDismiss();
function loadDismiss(){
  try{
    const o = JSON.parse(localStorage.getItem(LS_DISMISS) || "null");
    if (o && typeof o === "object") return o;
  }catch(e){}
  return {};
}
function saveDismiss(){ try{ localStorage.setItem(LS_DISMISS, JSON.stringify(DISMISS)); }catch(e){} }
function testKey(it){ return [it.srcDate || "", it.subject || "", it.text || ""].join("||"); }
function isDismissed(code, key){ return !!(DISMISS[code] && DISMISS[code][key]); }
function dismissTest(code, key){
  if (!DISMISS[code]) DISMISS[code] = {};
  DISMISS[code][key] = 1;
  saveDismiss();
  renderList();
}
function restoreTests(code){
  if (DISMISS[code]){ delete DISMISS[code]; saveDismiss(); renderList(); }
}

/* =========================================================
   狀態
   ========================================================= */
const state = { sel: loadSel(), cls: 0, only: false, layout: loadLayout(), font: loadFont(), data: loadCache(), busy: {}, err: {} };

/* =========================================================
   抓取（直連失敗 → 多個跨域代理並行，先回先贏）
   ========================================================= */
/* 學校站沒有 CORS 標頭 → 瀏覽器只能靠代理取 HTML。
   實測（2026-10-28）：allorigins / codetabs 常 5xx，r.jina.ai 最穩，
   而且它支援 x-respond-with: html（回原始 HTML，利於精準解析表格）。 */
const PROXIES = [
  { mk: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u), t: 14000 },
  { mk: u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u), t: 14000 },
  { mk: u => "https://r.jina.ai/" + u, t: 24000, h: { "x-respond-with": "html" } }
];

async function getText(url, ms, outer, headers){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  if (outer) outer.addEventListener("abort", () => ctrl.abort(), { once:true });
  try{
    const res = await fetch(url, { signal: ctrl.signal, cache: "no-store", headers: headers || {} });
    if (!res.ok) throw new Error("HTTP " + res.status);
    let text = await res.text();
    if (/^\s*\{/.test(text)){                       // allorigins /get 會包一層 JSON
      try{ const j = JSON.parse(text); if (j && j.contents) text = j.contents; }catch(e){}
    }
    if (!/showworks|佈置作業|classcode/.test(text)) throw new Error("回傳內容不是作業頁");
    return text;
  }finally{
    clearTimeout(timer);
  }
}

async function fetchOnce(url){
  // 直連（若學校日後開放 CORS 就最快）與各代理同時開跑，先回先贏
  const ctrl = new AbortController();
  const jobs = [getText(url, 8000, ctrl.signal)]
    .concat(PROXIES.map(p => getText(p.mk(url), p.t, ctrl.signal, p.h)));
  try{
    const text = await Promise.any(jobs);
    ctrl.abort();
    return text;
  }catch(err){
    ctrl.abort();
    throw new Error("連線失敗（代理暫時不通）");
  }
}

async function fetchPage(url){
  let last = null;
  for (let i = 0; i < 2; i++){
    try{ return await fetchOnce(url); }
    catch(err){ last = err; if (i === 0) await sleep(700); }
  }
  throw last || new Error("連線失敗");
}

/* =========================================================
   解析學校頁面
   ========================================================= */
const SUBJ_KNOWN = new Set((
  "中|中文|語|語文|英文|英|ENG|ENGLISH|數|數學|代|代數|幾|幾何|物|物理|化|化學|生|生物|科|科學|" +
  "地|地理|歷|歷史|史|普|普通話|視|視藝|視覺藝術|音|音樂|體|體育|電|電腦|資訊|ICT|公民|公|" +
  "道德|倫|倫理|經濟|商|會計|設計|家政|工藝|閱讀|寫作|作文|書法|美術|美|圖|圖書|宗教|宗|通識|綜合|生活|" +
  "语|数|学|历|音|乐|体|育|电|脑|资|讯|图|书|阅|读|写|作|会|计|设|家|政|艺|综|合|活|术|美|科|理|化|地|生|物|文|英"
).split("|"));

function looksLikeSubject(tok){
  const t = String(tok || "").replace(/[.。、,，]$/, "").trim();
  if (!t || t.length > 7) return false;
  if (/^第|週|月|日|年|星期/.test(t)) return false;
  if (/^\d+$/.test(t)) return false;
  if (/^[A-Za-z]{1,6}$/.test(t)) return true;             // eng / math / ICT / PE
  if (SUBJ_KNOWN.has(t)) return true;
  if (SUBJ_KNOWN.has(t.toUpperCase())) return true;
  if (/^[\u4e00-\u9fff]{1,3}[A-E]$/.test(t)) return true; // 數A / 物B
  return false;
}

function cellLines(cell){
  let h = cell.innerHTML
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(div|p|tr|li|h\d)>/gi, "\n")
    .replace(/<[^>]+>/g, "");
  h = decodeEnt(h);
  return h.split("\n")
    .map(s => s.replace(/[\s\u00a0]+/g, " ").trim())
    .filter(Boolean);
}

function cellImages(cell){
  return [...cell.querySelectorAll("img")]
    .map(im => im.getAttribute("src") || "")
    .filter(Boolean)
    .map(src => {
      try{
        const u = new URL(src, location.href);
        // 只允許 http / https，拒絕 javascript: / data: / vbscript: 等可執行程式碼的協定
        if (u.protocol !== "http:" && u.protocol !== "https:") return "";
        return u.href;
      }catch(e){ return ""; }
    })
    .filter(Boolean);
}

const isHan = c => /[\u4e00-\u9fff]/.test(c || "");
const isLat = c => /[A-Za-z0-9]/.test(c || "");

/* 「物p.31…」這種科目緊貼內容、沒有冒號也沒有空格的寫法 */
function tightSubject(line){
  const m = line.match(/^([A-Za-z\u4e00-\u9fff]{1,4}[A-Ea-e]?)(.+)$/);
  if (!m) return null;
  const head = m[1], rest = m[2];
  for (let len = head.length; len >= 1; len--){
    const cand = head.slice(0, len);
    const after = head.slice(len) + rest;
    if (!after) continue;
    const ch = after[0];
    if (isHan(ch)) continue;                        // 科目後面直接接中文 → 不是前綴
    if (isLat(cand[0]) && isLat(ch)) continue;      // 英文字被切斷（reading → read）
    if (looksLikeSubject(cand)) return { subj:cand, text:after };
  }
  return null;
}

function splitItems(lines){
  const items = [];
  for (const raw of lines){
    const line = raw.trim();
    if (!line) continue;
    let subj = "", text = line;

    const m = line.match(/^([^：:]{1,7})[：:]\s*(.*)$/);
    if (m && looksLikeSubject(m[1])){
      subj = m[1].trim();
      text = m[2].trim();
    }else{
      const m2 = line.match(/^([A-Za-z\u4e00-\u9fff]{1,3}[A-Ea-e]?)\s+(.+)$/);
      if (m2 && looksLikeSubject(m2[1])){ subj = m2[1]; text = m2[2].trim(); }
      else{
        const t = tightSubject(line);
        if (t){ subj = t.subj; text = t.text.trim(); }
      }
    }

    const last = items[items.length - 1];
    if (subj){
      if (last && last.subject === subj && !last.img) last.text += (last.text ? "\n" : "") + text;
      else items.push({ subject: subj, text });
    }else if (last && !last.img){
      last.text += (last.text ? "\n" : "") + line;   // 續行併回上一項
    }else{
      items.push({ subject: "", text: line });       // 無科目前綴的說明行
    }
  }
  return items;
}

function resolveDate(mo, dy, base){
  const y0 = base.getFullYear();
  let best = null;
  for (const y of [y0 - 1, y0, y0 + 1]){
    const d = new Date(y, mo - 1, dy);
    if (d.getMonth() !== mo - 1 || d.getDate() !== dy) continue;
    const diff = Math.abs(d - base);
    if (!best || diff < best.diff) best = { d, diff };
  }
  return best ? best.d : null;
}

function parsePage(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const bucket = new Map();
  const t0 = today0();

  doc.querySelectorAll("tr").forEach(tr => {
    const cells = tr.querySelectorAll("td,th");
    if (cells.length < 4) return;

    const dm = (cells[0].textContent || "").match(/(\d{1,2})\s*[-/.月]\s*(\d{1,2})/);
    if (!dm) return;
    const d = resolveDate(+dm[1], +dm[2], t0);
    if (!d) return;

    let due = null;
    const dm2 = (cells[3].textContent || "").match(/(\d{1,2})\s*[-/.月]\s*(\d{1,2})/);
    if (dm2){
      due = resolveDate(+dm2[1], +dm2[2], d);
      if (due && due < d) due = new Date(due.getFullYear(), due.getMonth() + 1, due.getDate());
    }

    const items = splitItems(cellLines(cells[2]));
    cellImages(cells[2]).forEach(src => items.push({ subject:"", text:"", img:src }));
    if (!items.length) return;

    const key = ymd(d);
    if (!bucket.has(key)) bucket.set(key, { date:key, due:null, items:[] });
    const b = bucket.get(key);
    if (due && (!b.due || ymd(due) > b.due)) b.due = ymd(due);
    items.forEach(it => {
      if (!b.items.some(o => o.subject === it.subject && o.text === it.text && o.img === it.img)) b.items.push(it);
    });
  });

  return [...bucket.values()].sort((a, b) => (a.date < b.date ? 1 : -1));
}

/* =========================================================
   顏色標示：簽改 / 測驗
   ========================================================= */
/* 簽改/測 關鍵字：依據 27 班實際作業用語歸納（見 analyze_signs.py 的分析結果）
   簽改類：簽改/簽名/改簽/簽/改正/訂正/更正/改X（改簿·改卷·改錯·改題·改本·改作業）/Sign/Corr/Correction/Signing
   測驗類：小測/大測/測驗/測/默書/默寫/默/背默/背誦/背書/Quiz/Test/Dict/Dictation/Spelling/Exam
   調整說明：
   - 補回「改正 / 改簽 / 改簿 / 訂正 / 更正 / 默寫 / 背默 / 背誦」等高頻詞（舊版漏抓）
   - 移除 Dictionary（「查字典」不是測驗，避免誤判）
   - 簽(?!到) 排除「簽到」這類非功課簽改 */
const TOKEN_RE = /(簽改|簽名|改簽|簽(?!到)|改正|訂正|更正|改[正簽簿卷錯題本作業]|考試|期中考|期末考|段考|月考|模擬考|大考|小考|小測|大測|測驗|測|默書|默寫|默|背默|背誦|背書|\b(?:Dictation|Dict|Quiz|Test|Sign|Signing|Correction|Corr|Spelling|Exam|Examination)\b)/gi;

function clsOfWord(w){
  if (/^(簽改|簽名|改簽|簽|改正|訂正|更正|改[正簽簿卷錯題本作業]|sign|corr|correction|signing)$/i.test(w)) return "sign";
  if (/^(考試|期中考|期末考|段考|月考|模擬考|大考|exam|examination)$/i.test(w)) return "exam";
  if (/測|默|背|小考|dict|quiz|test|spelling/i.test(w)) return "test";
  return "";
}
function markup(text){
  let out = "", last = 0, m, flags = { sign:false, test:false, exam:false };
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(text)) !== null){
    const word = m[0], kind = clsOfWord(word);
    if (!kind) continue;
    flags[kind] = true;
    out += esc(text.slice(last, m.index)) + '<mark class="k-' + kind + '">' + esc(word) + "</mark>";
    last = m.index + word.length;
  }
  out += esc(text.slice(last));
  return { html: out, flags };
}

/* 作業提及的線上平台標識：智學網（純標籤）、eclass（帶連結） */
function srcTags(text){
  const tags = [];
  if (/智學網/.test(text)) tags.push({ label:"智學網", url:null });
  if (/eclass/i.test(text)) tags.push({ label:"eclass", url:"http://eclass.pooito.edu.mo/" });
  return tags;
}
function srcTagHtml(t){
  return t.url
    ? `<a class="srctag" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.label)} ↗</a>`
    : `<span class="srctag">${esc(t.label)}</span>`;
}
/* 內文出現的「智學網 / eclass」就地轉成標識，不再於句尾重複 */
function markupText(it){
  let out = markup(it.text).html;
  const tags = srcTags(it.text);
  if (!tags.length) return out;
  tags.forEach(t => {
    const re = t.label === "智學網" ? /智學網/g : /eclass/gi;
    out = out.replace(re, srcTagHtml(t));
  });
  return out;
}

const SUBJ_COLORS = ["#2f6fb0", "#0e8a7d", "#b4692b", "#8a4fbf", "#b3457a", "#2f7f4f", "#b0452b", "#3d6ea8"];
function subjColor(s){
  let h = 0;
  for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return SUBJ_COLORS[h % SUBJ_COLORS.length];
}

/* 交期提示（只在最近一日顯示） */
function dueInfo(dueStr){
  if (!dueStr) return null;
  const diff = Math.round((parseD(dueStr) - today0()) / 86400000);
  let label, tone = "";
  if (diff < 0){ label = "已過 " + (-diff) + " 天"; tone = "late"; }
  else if (diff === 0){ label = "今天交"; tone = "soon"; }
  else if (diff === 1){ label = "明天交"; tone = "soon"; }
  else if (diff === 2){ label = "後天交"; }
  else { label = diff + " 天後交"; }
  return { label, tone };
}

function renderStrip(){

  const el = document.getElementById("classStrip");
  el.innerHTML = state.sel.map((code, i) => {
    const rec = state.data[code];
    const hasToday = !!(rec && rec.days && rec.days.some(d => d.date === t0));
    const acc = accentOf(code);
    return `<button class="cchip${state.busy[code] ? " busy" : ""}" role="tab"
              data-i="${i}" aria-selected="${i === state.cls}" style="--c:${acc}"

      ${hasToday ? '<span class="cnow">今天</span>' : ""}

  }).join("");
  el.querySelectorAll(".cchip").forEach(b => {
    b.onclick = () => selectClass(+b.dataset.i);
  });
  document.documentElement.style.setProperty("--accent", accentOf(currentCode()));
  centerChip(false);

function centerChip(smooth){
  const strip = document.getElementById("classStrip");
  const el = strip.querySelector('.cchip[aria-selected="true"]');
  if (!el) return;
  const sr = strip.getBoundingClientRect(), er = el.getBoundingClientRect();
  const delta = (er.left - sr.left) + strip.scrollLeft - (strip.clientWidth - er.width) / 2;
  const left = Math.max(0, Math.min(strip.scrollWidth - strip.clientWidth, delta));
  if (smooth && Math.abs(left - strip.scrollLeft) > 2) strip.scrollTo({ left, behavior:"smooth" });
  else strip.scrollLeft = left;
}

function refreshNav(){ renderStrip(); }

function selectClass(i){
  i = Math.max(0, Math.min(state.sel.length - 1, i));
  if (i === state.cls){ centerChip(true); return; }
  state.cls = i;
  refreshNav();
  renderSources();
  renderList();
  try{ history.replaceState(null, "", "#" + currentCode()); }catch(e){}
  if (window.scrollY > 4) window.scrollTo({ top:0, behavior:"smooth" });
  centerChip(true);
  ensureData(currentCode());
}

function matchItems(day, only){
  return day.items.filter(it => {
    if (it.img) return !only;
    if (only){
      const r = markup(it.text);
      if (!r.flags.sign && !r.flags.test) return false;
    }
    return true;
  });
}

function currentCode(){ return state.sel[state.cls] || state.sel[0]; }

function renderList(){
  const code = currentCode();
  const list = document.getElementById("list");
  const rec = state.data[code];

  if (!rec || !rec.days || !rec.days.length){
    if (state.busy[code] || !state.err[code]){
      list.innerHTML = `<div class="empty">正在抓取 ${esc(nameOf(code))} 的作業…<br>
        <span style="font-size:12px;opacity:.75">首次載入需時數秒</span></div>`;
    }else{
      list.innerHTML = `<div class="empty">抓不到 ${esc(nameOf(code))} 的資料<br>
        <span style="font-size:12px;opacity:.8">${esc(state.err[code])}</span><br>
        <button class="retry" data-code="${esc(code)}">再試一次</button></div>`;
      const btn = list.querySelector(".retry");
      if (btn) btn.onclick = () => ensureData(btn.dataset.code, true);
    }
    return;
  }

  const days = rec.days
    .map(d => ({ ...d, shown: matchItems(d, state.only) }))
    .filter(d => d.shown.length > 0);

  if (!days.length){
    list.innerHTML = `<div class="empty">沒有符合條件的作業紀錄` +
      (state.only ? `<br>試試關閉「簽改/測」篩選` : "") + `</div>`;
    return;
  }

  function itemsHtml(items){
    let signN = 0, testN = 0, examN = 0;
    const rows = items.map(it => {
      if (it.img) return `<li class="note"><a class="img" href="${esc(it.img)}" target="_blank" rel="noopener">📎 附圖</a></li>`;
      const r = markup(it.text);
      if (r.flags.sign) signN++;
      if (r.flags.test) testN++;
      if (r.flags.exam) examN++;
      const body = markupText(it);
      if (!it.subject) return `<li class="note">${body}</li>`;
      const col = subjColor(it.subject);
      return `<li><span class="subj" style="color:${col};border-color:${col}55;background:${col}12">${esc(it.subject)}</span>` +
             `<span class="txt">${body}</span></li>`;
    }).join("");
    return { rows, signN, testN, examN };
  }

  const t0 = today0();
  let html = "";

  if (state.layout === "tests"){
    list.innerHTML = renderTests();
    return;
  }

  if (state.layout === "subject"){
    /* 科目分組：把整週功課按科目歸類 */
    const map = new Map();
    days.forEach(d => d.shown.forEach(it => {
      const key = it.subject || "（說明）";
      if (!map.has(key)) map.set(key, []);
      map.get(key).push({ ...it, date:d.date });
    }));
    const keys = [...map.keys()].sort((a, b) => a.localeCompare(b, "zh-Hant"));
    keys.forEach((key, gi) => {
      const arr = map.get(key);
      let sN = 0, tN = 0, eN = 0;
      const items = arr.map(it => {
        const mr = markup(it.text);
        if (mr.flags.sign) sN++;
        if (mr.flags.test) tN++;
        if (mr.flags.exam) eN++;
        const body = markupText(it);
        return `<li><span class="dtag">${mmdd(it.date)}</span><span class="txt">${body}</span></li>`;
      }).join("");
      const col = key === "（說明）" ? "#8b8274" : subjColor(key);
      html += `<section class="subj-group" style="animation-delay:${Math.min(gi * 18, 220)}ms">
        <div class="sg-head">
          <span class="subj" style="color:${col};border-color:${col}55;background:${col}12">${esc(key)}</span>
          ${sN ? `<span class="chip sign">簽改 ${sN}</span>` : ""}
          ${tN ? `<span class="chip test">測驗 ${tN}</span>` : ""}
          ${eN ? `<span class="chip exam">考試 ${eN}</span>` : ""}
          <span class="sg-count">${arr.length} 項</span>
        </div>
        <ul class="items sg-items">${items}</ul>
        <div class="sg-foot">
          <button class="share-btn share-subj" data-subject="${esc(key)}" type="button" aria-label="分享此科功課圖片">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
            分享
          </button>
        </div>
      </section>`;
    });
  } else {
    days.forEach((d, idx) => {
      const dt = parseD(d.date);
      const due = idx === 0 ? dueInfo(d.due) : null;    // 交期只在最近一日顯示
      const r = itemsHtml(d.shown);
      const isToday = dt.getTime() === t0.getTime();
      const dateLabel = `${dt.getMonth() + 1} 月 ${dt.getDate()} 日 · 週${WEEK[dt.getDay()]}`;

      html += `<article class="day${isToday ? " today" : ""}" data-date="${esc(d.date)}" style="animation-delay:${Math.min(idx * 18, 220)}ms">
        <div class="body">
          <div class="hd">
            <h2>${dateLabel}</h2>
            ${isToday ? '<span class="chip today">今天</span>' : ""}
            ${r.signN ? `<span class="chip sign">簽改 ${r.signN}</span>` : ""}
            ${r.testN ? `<span class="chip test">測驗 ${r.testN}</span>` : ""}
            ${r.examN ? `<span class="chip exam">考試 ${r.examN}</span>` : ""}
            ${due && d.due ? `<span class="chip due ${due.tone}">交 ${mmdd(d.due)} · ${due.label}</span>` : ""}
          </div>
          <ul class="items">${r.rows}</ul>
          <div class="dfoot">
            <button class="share-btn share-day" data-date="${esc(d.date)}" type="button" aria-label="分享此日功課圖片">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
              分享
            </button>
          </div>
        </div>
      </article>`;
    });
  }
  list.innerHTML = html;
}

/* 測驗佈局：列出「上週至本週」被提及（公告）的測驗 / 考試 */
function renderTests(){
  const code = currentCode();
  const rec = state.data[code];
  if (!rec || !rec.days || !rec.days.length) return `<div class="empty">尚無資料</div>`;

  const RE_ISO = /^\d{4}-\d{2}-\d{2}$/;
  const now = today0();
  const dow = now.getDay();                                   // 0=週日
  const diffToMon = (dow === 0) ? -6 : (1 - dow);            // 回算本週一
  const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);
  const lastMonday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() - 7);
  const thisSunday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() + 6);

  const DOW = ["日", "一", "二", "三", "四", "五", "六"];
  const all = [];
  rec.days.forEach(d => {
    const ad = parseD(d.date);
    if (!ad || ad < lastMonday || ad > thisSunday) return;    // 只取「上週至本週」被提及者
    (d.items || []).forEach(it => {
      if (it.img) return;
      const r = markup(it.text);
      if (!r.flags.test && !r.flags.exam) return;             // 只收 quiz / 測驗 / 考試（有測/考即收；改正小測等視同測驗）
      const due = (d.due && RE_ISO.test(d.due)) ? parseD(d.due) : null;
      all.push({ ad, due, kind: r.flags.exam ? "exam" : "test", subject: it.subject || "", text: it.text, srcDate: d.date });
    });
  });
  // 排序：按公告日（被提到的日期）由新至舊，最近被登記的測驗在最上
  all.sort((a, b) => b.ad - a.ad);

  let hidden = 0;
  const items = all.filter(it => {
    const key = testKey(it);
    if (isDismissed(code, key)){ hidden++; return false; }    // 手動隱藏過的不再顯示
    const testDay = it.due || it.ad;
    it.passed = testDay < now;                                 // 測驗日已過 → 可手動移除
    return true;
  });

  const emptyWrap = (inner) => `<div class="cal-list">
      <div class="cal-list-h"><span>上週至本週 提過的測驗</span><span class="cal-ref">僅供參考</span></div>
      ${inner}
    </div>
    <div class="cal-foot"><button class="share-btn share-tests" type="button" aria-label="分享本週測驗圖片">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
      分享</button></div>`;

  if (!all.length){
    return `<div class="empty">上週至本週尚未偵測到「測驗 / 考試」項目` +
      (state.only ? `<br>試試關閉「簽改/測」篩選` : "") + `</div>`;
  }
  if (!items.length){
    return emptyWrap(`<div class="cal-restore"><span>已隱藏 ${hidden} 項已過的測驗</span><button class="cal-restore-btn" type="button">還原</button></div>`);
  }

  const rows = items.map(it => {
    const md = (it.ad.getMonth() + 1) + "月" + it.ad.getDate() + "日（週" + DOW[it.ad.getDay()] + "）";
    const subj = it.subject ? `<b class="cl-subj">${esc(it.subject)}</b> ` : "";
    const dueTxt = (it.due && it.due.getTime() !== it.ad.getTime())
      ? ` <span class="cl-due">· 測驗 ${it.due.getMonth() + 1}/${it.due.getDate()}</span>` : "";
    const rm = it.passed
      ? `<button class="cal-rm" type="button" aria-label="隱藏這個已過的測驗" data-key="${esc(testKey(it))}">✕</button>` : "";
    return `<div class="cal-li cal-tap${it.passed ? " past" : ""}" data-date="${esc(it.srcDate)}" title="點擊查看當日功課">
        <span class="cl-d">${md}${it.passed ? '<span class="cl-past">已過</span>' : ""}</span><span class="cl-c ${it.kind}">${subj}${esc(it.text)}${dueTxt}</span>${rm}</div>`;
  }).join("");

  const restore = hidden
    ? `<div class="cal-restore"><span>已隱藏 ${hidden} 項已過的測驗</span><button class="cal-restore-btn" type="button">還原</button></div>` : "";

  return emptyWrap(rows + restore);
}

/* 測驗清單點項目 → 跳到對應日期的功課內容（卡片檢視），並高亮該日 */
function gotoDay(date){
  if (state.layout !== "card") setLayout("card");
  requestAnimationFrame(() => {
    const el = document.querySelector('#list [data-date="' + date + '"]');
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1600);
  });
}

/* =========================================================
   抓取各班
   ========================================================= */
function isFresh(at){
  if (!at) return false;
  const t = new Date(String(at).replace(" ", "T"));
  if (isNaN(t.getTime())) return false;
  return (Date.now() - t.getTime()) < CACHE_MIN * 60 * 1000;
}

async function ensureData(code, force){
  const rec = state.data[code];
  if (!force && rec && rec.days && rec.days.length && isFresh(rec.at)) return;
  if (state.busy[code]) return;

  state.busy[code] = true;
  delete state.err[code];
  refreshNav(); if (code === currentCode()) renderList();

  try{
    const html = await fetchPage(URL_BASE + code);
    const days = parsePage(html);
    if (!days.length) throw new Error("解析不到作業");
    state.data[code] = { at: stamp(), days };
    saveCache();
  }catch(err){
    state.err[code] = (err && err.message) || "網絡問題";
  }finally{
    state.busy[code] = false;
    refreshNav(); if (code === currentCode()) renderList();
  }
}

  });

  document.getElementById("sheetFoot").textContent =
    `已選 ${state.sel.length}/${MAX_SEL} 個班級` + (state.sel.length >= MAX_SEL ? "（已達上限）" : "");
}

function toggleClass(code){

  if (i >= 0){

/* =========================================================
   分享：把目前功課轉成一張圖（自繪 canvas，無外部依賴）
   - 手機：優先用 Web Share API 直接分享到 WeChat / WhatsApp
   - 不支援時：下載 PNG，再手動分享
   ========================================================= */
function rr(ctx, x, y, w, h, r){
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapLines(ctx, text, maxW){
  const lines = [];
  let line = "";
  for (const ch of String(text)){
    const t = line + ch;
    if (line && ctx.measureText(t).width > maxW){ lines.push(line); line = ch; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

const SHARE_FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans GB",sans-serif';

async function shareImage(filter){
  const code = currentCode();
  const rec = state.data[code];
  if (!rec || !rec.days || !rec.days.length){ toast("尚無資料可分享", true); return; }
  let days = rec.days
    .map(d => ({ ...d, shown: matchItems(d, state.only) }))
    .filter(d => d.shown.length > 0);
  if (!days.length){ toast("目前沒有符合條件的作業", true); return; }

  /* 過濾成「單日」或「單科」 */
  let title = nameOf(code);
  if (filter && filter.date){
    days = days.filter(d => d.date === filter.date);
    const dt = parseD(filter.date);
    if (dt && !isNaN(dt.getTime())) title += ` · ${dt.getMonth() + 1}月${dt.getDate()}日`;
    if (!days.length){ toast("該日沒有作業", true); return; }
  } else if (filter && filter.subject != null){
    const subj = filter.subject;
    days = days.map(d => ({ ...d, shown: d.shown.filter(it => {
      const s = it.subject || "";
      return subj === "（說明）" ? !s : s === subj;
    }) }))
    .filter(d => d.shown.length > 0);
    title += ` · ${subj}`;
    if (!days.length){ toast("該科目沒有作業", true); return; }
  }

  const W = 720, pad = 28, cW = W - pad * 2;
  const t0 = today0();
  let accent = "#2f6fb0";
  try{ accent = (getComputedStyle(document.documentElement).getPropertyValue("--accent") || "").trim() || accent; }catch(e){}

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  /* 先量總高度 */
  let y = pad + 40 + 26 + 14;
  for (const d of days){
    const dt = parseD(d.date);
    ctx.font = `700 21px ${SHARE_FONT}`;
    let hw = ctx.measureText(`${dt.getMonth() + 1} 月 ${dt.getDate()} 日 · 週${WEEK[dt.getDay()]}`).width;
    if (dt.getTime() === t0.getTime()) hw += 56;
    y += 32 + 10;
    for (const it of d.shown){
      if (it.img){ y += 28; continue; }
      const r = markup(it.text);
      const prefix = (r.flags.sign ? "簽改 " : "") + (r.flags.test ? "測驗 " : "") + (r.flags.exam ? "考試 " : "");
      let tx = pad;
      if (it.subject){ ctx.font = `600 14px ${SHARE_FONT}`; tx = pad + ctx.measureText(it.subject).width + 28; }
      ctx.font = `19px ${SHARE_FONT}`;
      const lines = wrapLines(ctx, prefix + it.text, Math.max(40, cW - (tx - pad)));
      y += Math.max(1, lines.length) * 28 + (it.subject ? 6 : 10);
    }
    y += 10;
  }
  y += 30;
  canvas.width = W;
  canvas.height = Math.max(y + pad, 200);

  /* 背景 */
  ctx.fillStyle = "#fffdf9";
  ctx.fillRect(0, 0, W, canvas.height);

  /* 重畫 */
  y = pad;
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = accent;
  ctx.font = `800 27px ${SHARE_FONT}`;
  ctx.fillText(title + " 功課", pad, y + 30);
  y += 40;
  ctx.fillStyle = "#8b8274";
  ctx.font = `15px ${SHARE_FONT}`;
  ctx.fillText(`更新：${rec.at || "—"} · 以原網址為準`, pad, y + 18);
  y += 26 + 14;

  for (const d of days){
    const dt = parseD(d.date);
    const isToday = dt.getTime() === t0.getTime();
    const head = `${dt.getMonth() + 1} 月 ${dt.getDate()} 日 · 週${WEEK[dt.getDay()]}`;
    ctx.fillStyle = "#2c2620";
    ctx.font = `700 21px ${SHARE_FONT}`;
    ctx.fillText(head, pad, y + 22);
    let cx = pad + ctx.measureText(head).width + 12;
    if (isToday){
      const tw = 46;
      rr(ctx, cx, y + 4, tw, 22, 11);
      ctx.fillStyle = accent; ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = `700 13px ${SHARE_FONT}`; ctx.textBaseline = "middle"; ctx.textAlign = "center";
      ctx.fillText("今天", cx + tw / 2, y + 15); ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
    }
    y += 32;
    ctx.strokeStyle = "#e9e1d4"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
    y += 10;

    for (const it of d.shown){
      if (it.img){ y += 28; continue; }
      const r = markup(it.text);
      const isNote = !it.subject;
      let tx = pad;
      if (!isNote){
        const col = subjColor(it.subject);
        ctx.font = `600 14px ${SHARE_FONT}`;
        const sw = ctx.measureText(it.subject).width;
        const cw = sw + 18, chh = 22;
        rr(ctx, pad, y, cw, chh, 6);
        ctx.fillStyle = col + "22"; ctx.fill();
        ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = col; ctx.textBaseline = "middle";
        ctx.fillText(it.subject, pad + 9, y + chh / 2); ctx.textBaseline = "alphabetic";
        tx = pad + cw + 10;
      }
      const prefix = (r.flags.sign ? "簽改 " : "") + (r.flags.test ? "測驗 " : "") + (r.flags.exam ? "考試 " : "");
      ctx.font = `19px ${SHARE_FONT}`;
      const full = prefix + it.text;
      const lines = wrapLines(ctx, full, Math.max(40, cW - (tx - pad)));
      if (lines.length){
        let cx2 = tx;
        if (prefix){
          ctx.fillStyle = r.flags.sign ? "#9c6a14" : (r.flags.exam ? "#b4692b" : "#a8244a");
          ctx.fillText(prefix, cx2, y + 19);
          cx2 += ctx.measureText(prefix).width;
          ctx.fillStyle = "#332d26";
        }
        ctx.fillText(lines[0].slice(prefix.length), cx2, y + 19);
        for (let i = 1; i < lines.length; i++) ctx.fillText(lines[i], pad, y + 19 + i * 28);
      }
      y += Math.max(1, lines.length) * 28 + (isNote ? 10 : 6);
    }
    y += 10;
  }

  ctx.fillStyle = "#a99f8f";
  ctx.font = `13px ${SHARE_FONT}`;
  ctx.fillText("本頁僅供參考 · 以學校原網址為準", pad, canvas.height - pad + 6);

  let blob = null;
  try{ blob = await new Promise(res => canvas.toBlob(res, "image/png")); }catch(e){ blob = null; }
  if (!blob){ toast("圖片生成失敗", true); return; }

  const fname = `功課_${title}_${ymd(today0())}.png`;
  const file = new File([blob], fname, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try{
      await navigator.share({ files: [file], title: title + " 功課", text: title + " 功課" });
      return;
    }catch(e){ if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  toast("已生成圖片，可手動分享到 WeChat / WhatsApp");
}

/* 分享「上週至本週」的測驗 / 考試清單為圖片（測驗清單右下角的分享鈕） */
async function shareTestsImage(){
  const code = currentCode();
  const rec = state.data[code];
  if (!rec || !rec.days || !rec.days.length){ toast("尚無資料可分享", true); return; }
  const RE_ISO = /^\d{4}-\d{2}-\d{2}$/;
  const now = today0();
  const dow = now.getDay();
  const diffToMon = (dow === 0) ? -6 : (1 - dow);
  const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);
  const lastMonday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() - 7);
  const thisSunday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() + 6);
  const items = [];
  rec.days.forEach(d => {
    const ad = parseD(d.date);
    if (!ad || ad < lastMonday || ad > thisSunday) return;   // 只取「上週至本週」被提及者
    (d.items || []).forEach(it => {
      if (it.img) return;
      const r = markup(it.text);
      if (!r.flags.test && !r.flags.exam) return;             // 只收測驗 / 考試（有測/考即收；改正小測等視同測驗）
      const dt = (d.due && RE_ISO.test(d.due)) ? parseD(d.due) : ad;   // 測驗當日（due）
      const key = [d.date, it.subject || "", it.text || ""].join("||");
      if (isDismissed(code, key)) return;                              // 跟隨頁面已隱藏的項目
      items.push({ ad, dt, kind: r.flags.exam ? "exam" : "test", subject: it.subject || "", text: it.text });
    });
  });
  // 與「測驗」清單頁一致：按公告日（被提到的日期）由新至舊
  items.sort((a, b) => b.ad - a.ad);
  if (!items.length){ toast("這段期間沒有測驗 / 考試", true); return; }

  const W = 720, pad = 28, cW = W - pad * 2;
  let accent = "#2f6fb0";
  try{ accent = (getComputedStyle(document.documentElement).getPropertyValue("--accent") || "").trim() || accent; }catch(e){}
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const title = nameOf(code) + " · 上週至本週 測驗";

  let yPix = pad + 40 + 18 + 14;
  const dueStr = it => (it.dt.getTime() !== it.ad.getTime()) ? ` · 測驗 ${it.dt.getMonth() + 1}/${it.dt.getDate()}` : "";
  for (const it of items){
    yPix += 32;                                              // 日期行（含「已過」標預留空間）
    ctx.font = `18px ${SHARE_FONT}`;
    const ds = dueStr(it);
    const lines = it.subject
      ? wrapLines(ctx, it.text + ds, cW - (ctx.measureText(it.subject + " ").width + 6))
      : wrapLines(ctx, it.text + ds, cW - 8);
    yPix += Math.max(1, lines.length) * 26 + 8;
  }
  yPix += 30;
  canvas.width = W;
  canvas.height = Math.max(yPix + pad, 200);

  ctx.fillStyle = "#fffdf9"; ctx.fillRect(0, 0, W, canvas.height);
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = accent; ctx.font = `800 25px ${SHARE_FONT}`;
  ctx.fillText(title, pad, pad + 30);
  ctx.fillStyle = "#8b8274"; ctx.font = `14px ${SHARE_FONT}`;
  ctx.fillText(`更新：${rec.at || "—"} · 以原網址為準`, pad, pad + 52);

  let yy = pad + 40 + 18 + 14;
  for (const it of items){
    const passed = it.dt < now;
    const kindColor = it.kind === "exam" ? "#b4692b" : "#a8244a";
    // 日期行：與清單頁一致用「公告日」（ad）；已過加灰標
    ctx.fillStyle = accent; ctx.font = `700 19px ${SHARE_FONT}`;
    const dHead = `${it.ad.getMonth() + 1}月${it.ad.getDate()}日（週${WEEK[it.ad.getDay()]}）`;
    ctx.fillText(dHead, pad, yy + 18);
    let cx = pad + ctx.measureText(dHead).width + 8;
    if (passed){
      const tw = 38, th = 20;
      rr(ctx, cx, yy + 1, tw, th, 10);
      ctx.fillStyle = "#b0a696"; ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = `700 12px ${SHARE_FONT}`; ctx.textBaseline = "middle"; ctx.textAlign = "center";
      ctx.fillText("已過", cx + tw / 2, yy + 1 + th / 2); ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
    }
    yy += 32;
    // 內容行：科目（粗體墨色，與清單頁一致，不用色塊）+ 內文（依 測驗/考試 上色）+ 測驗日
    const ds = dueStr(it);
    if (it.subject){
      ctx.fillStyle = "#2c2620"; ctx.font = `700 15px ${SHARE_FONT}`;
      ctx.fillText(it.subject + " ", pad, yy + 15);
      const sw = ctx.measureText(it.subject + " ").width;
      ctx.font = (it.kind === "exam" ? `700 18px ` : `18px `) + SHARE_FONT;
      ctx.fillStyle = passed ? "#b0a696" : kindColor;
      const tl = wrapLines(ctx, it.text + ds, cW - (sw + 6));
      ctx.fillText(tl[0], pad + sw, yy + 15);
      for (let i = 1; i < tl.length; i++) ctx.fillText(tl[i], pad, yy + 15 + i * 26);
      yy += Math.max(1, tl.length) * 26 + 8;
    } else {
      ctx.font = (it.kind === "exam" ? `700 18px ` : `18px `) + SHARE_FONT;
      ctx.fillStyle = passed ? "#b0a696" : kindColor;
      const lines = wrapLines(ctx, it.text + ds, cW - 8);
      lines.forEach((ln, i) => ctx.fillText(ln, pad, yy + 15 + i * 26));
      yy += Math.max(1, lines.length) * 26 + 8;
    }
  }
  ctx.fillStyle = "#a99f8f"; ctx.font = `13px ${SHARE_FONT}`;
  ctx.fillText("本頁僅供參考 · 以學校原網址為準", pad, canvas.height - pad + 6);

  let blob = null;
  try{ blob = await new Promise(res => canvas.toBlob(res, "image/png")); }catch(e){ blob = null; }
  if (!blob){ toast("圖片生成失敗", true); return; }
  const fname = `功課_${title}_${ymd(today0())}.png`;
  const file = new File([blob], fname, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try{ await navigator.share({ files: [file], title: title, text: title }); return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  toast("已生成圖片，可手動分享到 WeChat / WhatsApp");
}

/* =========================================================
   手勢：單指左右滑＝切「作業/測驗/科目」呈現；雙指左右滑＝切班級
   ========================================================= */
const SWIPE_MIN = 54;
let sw = null;     // 單指（作業/測驗/科目 呈現）

function bindSwipe(){
  const area = document.querySelector("main.wrap");
  const sheetOpen = () => document.querySelector(".sheet-wrap.on");

  const clearTransform = anim => {
    if (anim){
      area.style.transition = "transform .2s ease";
      area.style.transform = "translateX(0)";
      setTimeout(() => { area.style.transition = ""; area.style.transform = ""; }, 220);
    }else{
      area.style.transition = "";
      area.style.transform = "";
    }
    document.body.classList.remove("dragging");
  };

  area.addEventListener("touchstart", e => {
    if (sheetOpen() || e.touches.length !== 1){ sw = null; return; }
    const t = e.touches[0];
    sw = { x:t.clientX, y:t.clientY, dx:0, dir:null };
  }, { passive:true });

  area.addEventListener("touchmove", e => {
    if (!sw || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (sw.dir === null){
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      sw.dir = Math.abs(dx) > Math.abs(dy) * 1.15 ? "x" : "y";
      if (sw.dir === "x") document.body.classList.add("dragging");
    }
    if (sw.dir !== "x") return;
    e.preventDefault();
    sw.dx = dx;
    area.style.transform = "translateX(" + dx + "px)";
  }, { passive:false });

  const end = () => {
    if (!sw) return;
    const dx = sw.dx, moved = sw.dir === "x";
    sw = null;
    if (!moved){ document.body.classList.remove("dragging"); return; }
    if (Math.abs(dx) >= SWIPE_MIN){
      clearTransform(false);
      cycleLayout(dx < 0 ? 1 : -1);                 // 向左滑 → 下一個呈現；向右滑 → 上一個（循環）
    }else{
      clearTransform(true);
    }
  };
  area.addEventListener("touchend", end);
  area.addEventListener("touchcancel", end);
}

/* 向左 / 向右滑動切換「呈現方式」（作業 / 測驗 / 科目），循環切換 */
function cycleLayout(dir){
  const i = LAYOUTS.findIndex(l => l.k === state.layout);
  const n = (i + (dir > 0 ? 1 : -1) + LAYOUTS.length) % LAYOUTS.length;
  setLayout(LAYOUTS[n].k);
}

/* =========================================================
   初始化
   ========================================================= */
(function init(){
  document.getElementById("openMenu").onclick = openSheet;
  document.querySelectorAll("[data-close]").forEach(el => el.onclick = closeSheet);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape"){ closeSheet(); return; }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "select" || tag === "textarea") return;
      selectClass(state.cls + (e.key === "ArrowRight" ? 1 : -1));
    }
  });

  const only = document.getElementById("onlyFlags");
  only.addEventListener("change", () => { state.only = only.checked; renderList(); });

  // 頁面內的呈現方式切換（隨手可切，不必進設定）
  document.querySelectorAll("#laySwitch button").forEach(b => {
    b.onclick = () => setLayout(b.dataset.lay);
  });

  // 測驗清單點項目 → 跳到對應日期功課；分享為圖片：卡片、科目群組右下角的分享鈕
  const listEl = document.getElementById("list");
  if (listEl) listEl.addEventListener("click", (e) => {
    const rm = e.target.closest(".cal-rm");
    if (rm){ dismissTest(currentCode(), rm.dataset.key); return; }   // 隱藏已過的測驗
    const rest = e.target.closest(".cal-restore-btn");
    if (rest){ restoreTests(currentCode()); return; }                // 一次還原全部
    const tap = e.target.closest(".cal-tap");
    if (tap){ gotoDay(tap.dataset.date); return; }
    const b = e.target.closest(".share-day, .share-subj, .share-tests");
    if (!b) return;
    if (b.classList.contains("share-day")) shareImage({ date: b.dataset.date });
    else if (b.classList.contains("share-subj")) shareImage({ subject: b.dataset.subject });
    else shareTestsImage();
  });

  const hash = location.hash.replace("#", "");
  const hi = state.sel.indexOf(hash);
  if (hi >= 0) state.cls = hi;

  bindSwipe();
  window.addEventListener("resize", () => { centerChip(false); syncMbarH(); });

  /* 同步底部工具條高度，供 toast 定位使用（簽改/測 開關已移至頂部） */
  function syncMbarH(){
    const bar = document.querySelector(".mbar");
    if (bar) document.documentElement.style.setProperty("--mbar-h", bar.offsetHeight + "px");
  }
  syncMbarH();
  if (window.ResizeObserver) new ResizeObserver(syncMbarH).observe(document.querySelector(".mbar"));
  window.addEventListener("load", syncMbarH);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncMbarH);

  renderSources();

  applyFont();
  refreshNav();
  syncLaySwitch();
  renderList();

  // 開頁即抓：各班獨立，先拿到先顯示
  state.sel.forEach((code, i) => {
    setTimeout(() => ensureData(code), i * 350);
  });
