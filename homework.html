function applyBackupSettings(s){
  if (!s || typeof s !== "object") return;
  if (Array.isArray(s.sel)){
    const ok = s.sel.filter(c => CLASSES.some(x => x.v === c));
    if (ok.length){ state.sel = sortSel(ok.slice(0, MAX_SEL)); state.cls = 0; saveSel(); }
  }
  if (LAYOUTS.some(l => l.k === s.layout)){
    state.layout = s.layout;
    try{ localStorage.setItem(LS_LAYOUT, s.layout); }catch(e){}
  }
  if (FONT_SIZES.some(f => f.k === s.font)){
    state.font = s.font;
    try{ localStorage.setItem(LS_FONT, s.font); }catch(e){}
    applyFont();
  }
  if (["manual","due","subject"].indexOf(s.taskSort) >= 0){ TASK_SORT = s.taskSort; saveTaskSort(); }
  if (s.dismiss && typeof s.dismiss === "object"){ DISMISS = s.dismiss; saveDismiss(); }
}
async function onUserImport(e){
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  try{
    const o = JSON.parse(await f.text());
    const arr = Array.isArray(o) ? o : (o && Array.isArray(o.tasks) ? o.tasks : null);
    if (!arr) throw new Error("格式不符");
    const got = arr.map(normTask).filter(Boolean);
    if (!got.length) throw new Error("沒有可用資料");
    if (o && o.settings){                                     // v2：整份備份 → 恢復
      if (!window.confirm("恢復備份：任務與設定（班級、顯示方式、字級、已隱藏測驗）都會被取代。\n確定繼續？")) return;
      applyBackupSettings(o.settings);
      TASKS = got;
      if (!saveTasks()) return;
      closeSheet();
      TASK_VIEW = { mode:"list", id:null };
      renderSheet(); renderSources(); refreshNav(); syncLaySwitch(); renderList(); refreshTaskBadge();
      ensureData(currentCode());
      toast("已恢復備份：" + got.length + " 筆任務 ＋ 設定");
    }else{                                                    // 舊版純任務 → 取代或合併
      const replace = window.confirm(
        "匯入 " + got.length + " 筆任務。\n按「確定」＝取代目前全部任務；按「取消」＝合併（保留現有）。");
      if (replace) TASKS = got;
      else{
        const ids = TASKS.map(t => t.id);
        got.forEach(t => { if (ids.indexOf(t.id) >= 0) t.id = uid(); TASKS.push(t); });
        TASKS.forEach((t, i) => { if (!t.order) t.order = i + 1; });
      }
      if (!saveTasks()) return;
      closeTaskSub(); TASK_VIEW = { mode:"list", id:null }; rerenderTasks();
      toast((replace ? "已取代為 " : "已合併 ") + got.length + " 筆任務");
    }
  }catch(err){ toast("匯入失敗：" + err.message, true); }
  e.target.value = "";
}

/* ---------- 子面板動作 ---------- */
function handleTaskSubAct(k, el){
  if (k === "tab-single" || k === "tab-batch"){
    const single = k === "tab-single";
    document.querySelectorAll(".tk-tabs button").forEach(b =>
      b.classList.toggle("on", b.dataset.subAct === k));
    const a = document.getElementById("tkFormSingle"), b = document.getElementById("tkFormBatch");
    if (a) a.hidden = !single;
    if (b) b.hidden = single;
    const sv = document.querySelector('[data-sub-act="save"]');
    if (sv) sv.textContent = single ? "新增" : "批量新增";
    return;
  }
  if (k === "rmatt"){
    if (!TASK_EDIT) return;
    TASK_EDIT.atts.splice(+el.dataset.i, 1); renderFormPreview(); return;
  }
  if (k === "save"){ saveTaskForm(); return; }
  if (k === "bulk-save"){ saveBulkForm(); return; }
  if (k === "pick-all"){ document.querySelectorAll("#tkPickList input").forEach(c => c.checked = true); return; }
  if (k === "pick-none"){ document.querySelectorAll("#tkPickList input").forEach(c => c.checked = false); return; }
  if (k === "share-text"){ shareTasksText(pickedTasks()); return; }
  if (k === "share-image"){ shareTasksImage(pickedTasks()); return; }
  if (k === "copy-text"){
    const ta = document.getElementById("tkShareText");
    if (ta){ ta.select(); try{ document.execCommand("copy"); toast("已複製"); }catch(e){ toast("請長按選取複製"); } }
  }
}
function bindTaskSubEvents(){
  const sub = document.getElementById("tkSub");
  sub.addEventListener("click", e => {
    if (e.target === sub){ closeTaskSub(); return; }          // 點半透明背景＝關閉
    if (e.target.closest("[data-sub-close]")){ closeTaskSub(); return; }
    const sa = e.target.closest("[data-sub-act]");
    if (sa){ handleTaskSubAct(sa.dataset.subAct, sa); return; }
    const im = e.target.closest("[data-lb-edit]");
    if (im){
      e.stopPropagation();
      const a = TASK_EDIT && TASK_EDIT.atts[+im.dataset.lbEdit];
      if (a) showLightbox(a.data, a.name);
    }
  });
  sub.addEventListener("input", e => { if (e.target.id === "tkFSubject") syncFormHint(); });
  sub.addEventListener("change", async e => {
    if (e.target.id === "tkFDue"){ e.target.dataset.auto = "0"; return; }
    if (e.target.id === "tkFFiles"){
      const got = await readAttachments(e.target.files);
      if (!TASK_EDIT) return;
      TASK_EDIT.atts = TASK_EDIT.atts.concat(got);
      e.target.value = "";
      renderFormPreview();
    }
  });
}

/* ---------- 手勢：向右拉露出刪除 ⋮⋮ 拖動排序（在 #list 任務呈現內） ---------- */
let TK_G = null;
function bindTaskGestures(){
  const body = document.getElementById("list");
  body.addEventListener("pointerdown", e => {
    const out = e.target.closest(".tk-row-outer");
    if (!out) return;
    if (e.target.closest(".tk-drag")){ startTaskDrag(e, out); return; }
    if (e.target.closest("button:not(.tk-main)")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const opened = out.classList.contains("opened");
    TK_G = { mode:"swipe", out, row:out.querySelector(".tk-row"),
      x:e.clientX, y:e.clientY, base:opened ? 88 : 0, tx:opened ? 88 : 0, moved:false, suppress:false };
  });
  document.addEventListener("pointermove", onTaskPointerMove, { passive:false });
  document.addEventListener("pointerup", onTaskPointerUp);
  document.addEventListener("pointercancel", onTaskPointerUp);
  body.addEventListener("click", e => {
    if (TK_G && TK_G.suppress){
      e.preventDefault(); e.stopPropagation(); TK_G.suppress = false; TK_G = null;
    }
  }, true);
}
function startTaskDrag(e, out){
  e.preventDefault();
  TK_G = { mode:"drag", out, moved:false, suppress:true };
  out.classList.add("dragging");
  try{ e.target.closest(".tk-drag").setPointerCapture(e.pointerId); }catch(err){}
}
function onTaskPointerMove(e){
  const g = TK_G; if (!g) return;
  if (g.mode === "swipe"){
    const dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (!g.moved){
      if (Math.abs(dy) > Math.abs(dx) * 1.15 && Math.abs(dy) > 6){ TK_G = null; return; }
      if (Math.abs(dx) < 6) return;
    }
    g.moved = true;
    if (e.cancelable) e.preventDefault();
    g.tx = Math.max(0, Math.min(88, g.base + dx));
    g.row.classList.remove("snap");
    g.row.style.transform = "translateX(" + g.tx + "px)";
  }else if (g.mode === "drag"){
    if (e.cancelable) e.preventDefault();
    g.moved = true;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const under = el && el.closest ? el.closest(".tk-row-outer") : null;
    const rows = document.getElementById("tkOpenRows");
    if (!under || !rows || under === g.out || under.parentNode !== rows) return;
    const r = under.getBoundingClientRect();
    rows.insertBefore(g.out, e.clientY < r.top + r.height / 2 ? under : under.nextSibling);
  }
}
function onTaskPointerUp(){
  const g = TK_G; if (!g) return;
  if (g.mode === "swipe"){
    const open = g.tx > 44;
    g.row.classList.add("snap");
    g.row.style.transform = "translateX(" + (open ? 88 : 0) + "px)";
    g.out.classList.toggle("opened", open);
    g.suppress = g.moved;
    TK_G = g.moved ? g : null;
    if (g.moved) setTimeout(() => { if (TK_G && TK_G.suppress) TK_G = null; }, 380);
  }else{
    g.out.classList.remove("dragging");
    if (g.moved) persistDragOrder();
    TK_G = g;
    setTimeout(() => { if (TK_G && TK_G.suppress) TK_G = null; }, 380);
  }
}
function persistDragOrder(){
  const rows = document.getElementById("tkOpenRows");
  if (!rows) return;
  const ids = Array.from(rows.querySelectorAll(".tk-row-outer")).map(o => o.dataset.id);
  let n = 1;
  ids.forEach(id => { const t = TASKS.find(x => x.id === id); if (t) t.order = n++; });
  TASKS.filter(t => ids.indexOf(t.id) < 0).forEach(t => { t.order = n++; });
  saveTasks(); toast("順序已更新");
}

/* ---------- 作業 / 測驗清單項目 → 加入任務 ---------- */
function addTaskFromItem(text, due, btn){
  const raw = String(text || "").trim();
  if (!raw) return;
  const sp = splitDueFromText(raw);                           // 日期 → 到期日，主題不再重複
  const subj = sp.subj;
  if (TASKS.some(t => t.status !== "done" && (t.subject === subj || t.subject === raw))){
    if (btn){ btn.classList.add("added"); btn.textContent = "✓"; }
    toast("這筆已在任務中"); return;
  }
  const d = sp.due || (/^\d{4}-\d{2}-\d{2}$/.test(due || "") ? due : "");
  TASKS.push({ id:uid(), subject:subj, status:"todo", due:d, content:"", atts:[],
    cls:currentCode(), pinned:false, order:nextOrder(), created:Date.now() });
  saveTasks();
  if (btn){ btn.classList.add("added"); btn.textContent = "✓"; }
  toast("已加入任務" + (d ? "（到期 " + d + "）" : ""));
}

/* ---------- 綁定 ---------- */
(function bindTasks(){
  const list = document.getElementById("list");
  if (!list) return;
  // 底部「任務」按鈕 → 切到「任務」呈現（清單內嵌在頁面內，非彈窗）
  document.getElementById("openTasks").addEventListener("click", () => {
    closeSheet();
    if (state.layout !== "task") setLayout("task");
    else { TASK_VIEW = { mode:"list", id:null }; renderList(); }
    window.scrollTo({ top:0, behavior:"smooth" });
  });
  list.addEventListener("click", onTaskAreaClick);
  list.addEventListener("change", e => {
    if (e.target.id === "tkSort"){
      TASK_SORT = e.target.value; saveTaskSort(); renderList();
    }
  });
  document.getElementById("tkImportFile").addEventListener("change", onUserImport);
  bindTaskSubEvents();
  bindTaskGestures();
  const lb = document.getElementById("lightbox");
  lb.addEventListener("click", e => {
    if (e.target === lb || e.target.closest("#lbClose")) closeLightbox();
  });
  refreshTaskBadge();
})();

/* =========================================================
   手勢：單指左右滑＝切「作業/測驗/任務」呈現（班級用底部班級條點選）
   ========================================================= */
const SWIPE_MIN = 54;
let sw = null;     // 單指（作業/測驗 呈現）

function bindSwipe(){
  const area = document.querySelector("main.wrap");
  const sheetOpen = () => document.querySelector(".sheet-wrap.on") || document.querySelector("#tkSub.on");

  const reset = anim => {
    area.style.transition = anim ? "transform .2s ease" : "";
    area.style.transform = "";
    document.body.classList.remove("dragging");
    if (anim) setTimeout(() => { area.style.transition = ""; }, 220);
  };

  area.addEventListener("touchstart", e => {
    if (sheetOpen() || e.touches.length !== 1){ sw = null; return; }
    // 任務列自帶橫向手勢（右拉刪除、⋮⋮ 拖動），滑動切呈現須避開
    if (e.target.closest && e.target.closest(".tk-row-outer")){ sw = null; return; }
    const t = e.touches[0];
    sw = { x:t.clientX, y:t.clientY, dx:0, dir:null };
  }, { passive:true });

  area.addEventListener("touchmove", e => {
    if (!sw || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (sw.dir === null){
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      sw.dir = Math.abs(dx) > Math.abs(dy) * 1.15 ? "x" : "y";
      if (sw.dir === "x") document.body.classList.add("dragging");
    }
    if (sw.dir !== "x") return;
    e.preventDefault();
    sw.dx = dx;
    // 跟手時同步切掉 transition，避免 iOS 回彈/殘影造成的閃爍
    area.style.transition = "";
    area.style.transform = "translateX(" + dx + "px)";
  }, { passive:false });

  const end = () => {
    if (!sw) return;
    const dx = sw.dx, moved = sw.dir === "x";
    sw = null;
    if (!moved){ document.body.classList.remove("dragging"); return; }
    if (Math.abs(dx) >= SWIPE_MIN){
      // 順著手勢把當前內容滑出，滑出完成後才換頁重繪，
      // 避免「瞬間彈回原位 → 再換新內容」造成的閃爍
      const dir = dx < 0 ? 1 : -1;
      const out = dir > 0 ? -1 : 1;
      let fired = false;
      const commit = () => {
        if (fired) return; fired = true;
        area.style.transition = "";
        area.style.transform = "";
        document.body.classList.remove("dragging");
        cycleLayout(dir);                 // 向左滑 → 下一個呈現；向右滑 → 上一個（循環）
      };
      area.style.transition = "transform .18s ease-out";
      area.style.transform = "translateX(" + (out * Math.max(160, Math.abs(dx) + 80)) + "px)";
      area.addEventListener("transitionend", commit, { once:true });
      setTimeout(commit, 220);            // 保險：少數瀏覽器 transitionend 不觸發
    }else{
      reset(true);
    }
  };
  area.addEventListener("touchend", end);
  area.addEventListener("touchcancel", end);
}

/* 向左 / 向右滑動切換「呈現方式」（作業 / 測驗 / 任務），循環切換 */
function cycleLayout(dir){
  const i = LAYOUTS.findIndex(l => l.k === state.layout);
  const n = (i + (dir > 0 ? 1 : -1) + LAYOUTS.length) % LAYOUTS.length;
  setLayout(LAYOUTS[n].k);
}

/* =========================================================
   初始化
   ========================================================= */
(function init(){
  document.getElementById("openMenu").onclick = openSheet;
  document.querySelectorAll("[data-close]").forEach(el => el.onclick = closeSheet);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape"){
      if (document.getElementById("lightbox").classList.contains("on")){ closeLightbox(); return; }
      if (document.getElementById("tkSub").classList.contains("on")){ closeTaskSub(); return; }
      closeSheet(); return;
    }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "select" || tag === "textarea") return;
      selectClass(state.cls + (e.key === "ArrowRight" ? 1 : -1));
    }
  });

  const only = document.getElementById("onlyFlags");
  only.addEventListener("change", () => { state.only = only.checked; renderList(); });

  // 頁面內的呈現方式切換（隨手可切，不必進設定）
  document.querySelectorAll("#laySwitch button").forEach(b => {
    b.onclick = () => setLayout(b.dataset.lay);
  });

  // 測驗清單點項目 → 跳到對應日期功課；分享為圖片：卡片右下角、測驗清單的分享鈕
  const listEl = document.getElementById("list");
  if (listEl) listEl.addEventListener("click", (e) => {
    const add = e.target.closest(".add-task");
    if (add){ addTaskFromItem(add.dataset.text, add.dataset.due, add); return; }
    const rm = e.target.closest(".cal-rm");
    if (rm){ dismissTest(currentCode(), rm.dataset.key); return; }   // 隱藏已過的測驗
    const rest = e.target.closest(".cal-restore-btn");
    if (rest){ restoreTests(currentCode()); return; }                // 一次還原全部
    const tap = e.target.closest(".cal-tap");
    if (tap){ gotoDay(tap.dataset.date); return; }
    const b = e.target.closest(".share-day, .share-tests");
    if (!b) return;
    if (b.classList.contains("share-day")) shareImage({ date: b.dataset.date });
    else shareTestsImage();
  });

  const hash = location.hash.replace("#", "");
  const hi = state.sel.indexOf(hash);
  if (hi >= 0) state.cls = hi;

  bindSwipe();
  window.addEventListener("resize", () => { centerChip(false); syncMbarH(); });

  /* 同步底部工具條高度，供 toast 定位使用（簽改/測 開關已移至頂部） */
  function syncMbarH(){
    const bar = document.querySelector(".mbar");
    if (bar) document.documentElement.style.setProperty("--mbar-h", bar.offsetHeight + "px");
  }
  syncMbarH();
  if (window.ResizeObserver) new ResizeObserver(syncMbarH).observe(document.querySelector(".mbar"));
  window.addEventListener("load", syncMbarH);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncMbarH);

  renderSources();

  applyFont();
  refreshNav();
  syncLaySwitch();
  renderList();

  // 開頁即抓：各班獨立，先拿到先顯示
  state.sel.forEach((code, i) => {
    setTimeout(() => ensureData(code), i * 350);
  });

  // 第一次使用提示手勢
  try{
    if (state.sel.length > 1 && !localStorage.getItem("hw_hint_v1")){
      localStorage.setItem("hw_hint_v1", "1");
      setTimeout(() => toast("單指左右滑切換呈現；點班級條切換班級；功課按＋可加入任務"), 1500);
    }
  }catch(e){}
})();
