<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作業佈置 · 初三C / 初一A</title>
<style>
  :root{
    --bg:#f5f2ec;
    --ink:#241f1a;
    --muted:#7c7469;
    --faint:#a89e91;
    --card:#fffdf9;
    --line:#e7dfd3;
    --accent:#2f6fb0;
    --sign-bg:#fbeece; --sign-fg:#8a5a06;
    --test-bg:#fbe0e7; --test-fg:#a3203f;
    --shadow:0 1px 2px rgba(60,48,32,.05), 0 8px 24px -16px rgba(60,48,32,.28);
    --fs:1;
    --font:"Noto Sans TC","Source Han Sans TC","PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html{text-size-adjust:100%;-webkit-text-size-adjust:100%}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1100px 480px at 12% -8%, #fff9ec 0%, rgba(255,249,236,0) 62%),
      radial-gradient(900px 420px at 92% 4%, #eef5f4 0%, rgba(238,245,244,0) 58%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    font-size:calc(16px * var(--fs));
    line-height:1.65;
    padding-bottom:64px;
  }
  .wrap{max-width:1020px;margin:0 auto;padding:0 20px}

  /* ---------- header ---------- */
  header.top{position:sticky;top:0;z-index:20;
    background:rgba(245,242,236,.88);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--line);
  }
  .top-inner{max-width:1020px;margin:0 auto;padding:16px 20px 12px}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:calc(21px * var(--fs));margin:0;letter-spacing:.02em;font-weight:700}
  .brand .sub{font-size:calc(13px * var(--fs));color:var(--muted)}
  .brand .sub b{color:var(--accent);font-weight:600}

  .tabs{display:inline-flex;gap:4px;padding:4px;margin-top:14px;
    background:#eae3d7;border-radius:999px;border:1px solid #e0d7c7}
  .tab{
    display:flex;align-items:center;gap:8px;
    border:0;background:transparent;cursor:pointer;
    padding:8px 18px;border-radius:999px;
    font-family:inherit;font-size:calc(15px * var(--fs));font-weight:600;color:#6d6459;
    transition:background .18s,color .18s,box-shadow .18s;
  }
  .tab .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
  .tab .n{font-size:calc(12px * var(--fs));font-weight:500;color:#948a7c;
    background:rgba(255,255,255,.55);border-radius:999px;padding:1px 7px}
  .tab:hover{color:#3a332b}
  .tab[aria-selected="true"]{background:var(--card);color:var(--accent);
    box-shadow:0 1px 2px rgba(60,48,32,.08),0 2px 10px -6px rgba(60,48,32,.3)}
  .tab[aria-selected="true"] .dot{opacity:1}
  .tab[aria-selected="true"] .n{color:var(--accent);background:rgba(0,0,0,.04)}

  .tools{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .search{position:relative;flex:1 1 220px;max-width:340px}
  .search input{
    width:100%;padding:9px 12px 9px 34px;font-family:inherit;font-size:calc(14px * var(--fs));
    border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);
    outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .search input:focus{border-color:color-mix(in srgb,var(--accent) 55%,#fff);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,#fff)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.42}
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    font-size:calc(13px * var(--fs));color:#5d564c;user-select:none;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .toggle input{appearance:none;width:30px;height:17px;border-radius:999px;background:#ded5c6;
    position:relative;cursor:pointer;transition:background .18s;margin:0}
  .toggle input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;
    border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .toggle input:checked{background:var(--accent)}
  .toggle input:checked::after{transform:translateX(13px)}

  .btn-refresh{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    font-family:inherit;font-size:calc(13px * var(--fs));color:#5d564c;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;
    transition:color .15s,border-color .15s,background .15s}
  .btn-refresh:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 42%,#fff)}
  .btn-refresh:disabled{cursor:progress;opacity:.62}
  .btn-refresh .ico{display:block}
  .btn-refresh.busy .ico{animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .btn-size{cursor:pointer;font-family:inherit;font-weight:700;
    font-size:calc(13px * var(--fs));color:#5d564c;line-height:1.2;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 11px;min-width:44px;
    transition:color .15s,border-color .15s,background .15s}
  .btn-size:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 42%,#fff)}

  .meta-line{font-size:calc(12.5px * var(--fs));color:var(--faint);margin-left:auto;white-space:nowrap}

  /* ---------- list ---------- */
  main{padding-top:22px}
  .stat{display:flex;gap:18px;flex-wrap:wrap;align-items:center;
    font-size:calc(13.5px * var(--fs));color:var(--muted);margin:0 0 16px 4px}
  .stat .k{display:inline-flex;align-items:center;gap:5px}
  .stat .sw{width:10px;height:10px;border-radius:3px;display:inline-block}

  .day{
    display:grid;grid-template-columns:88px 1fr;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
    animation:rise .32s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .rail{
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 8%,#fff) 0%,#fffdf9 100%);
    border-right:1px dashed var(--line);
    padding:16px 6px 14px;text-align:center;
  }
  .rail .m{font-size:calc(12.5px * var(--fs));letter-spacing:.06em;color:var(--muted)}
  .rail .d{font-size:calc(34px * var(--fs));line-height:1.05;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums;margin:2px 0 4px}
  .rail .w{font-size:calc(12.5px * var(--fs));color:var(--faint)}
  .rail .today{margin-top:6px;display:inline-block;font-size:calc(11px * var(--fs));font-weight:700;
    color:#fff;background:var(--accent);border-radius:999px;padding:1px 8px}

  .body{padding:16px 18px 14px;min-width:0}
  .body .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
  .body .hd h2{font-size:calc(17px * var(--fs));margin:0;font-weight:700;letter-spacing:.01em}
  .chip{font-size:calc(12px * var(--fs));font-weight:600;border-radius:999px;padding:2px 10px;line-height:1.6;
    border:1px solid transparent}
  .chip.sign{background:var(--sign-bg);color:var(--sign-fg)}
  .chip.test{background:var(--test-bg);color:var(--test-fg)}
  .chip.due{margin-left:auto;background:#f2eee6;color:#6b6357;font-weight:500}
  .chip.due.soon{background:color-mix(in srgb,var(--accent) 12%,#fff);color:var(--accent)}
  .chip.due.late{background:#f0ece4;color:#b0a696}

  ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  ul.items li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
  .subj{font-size:calc(12.5px * var(--fs));font-weight:700;line-height:1.6;padding:1px 8px;border-radius:6px;
    white-space:nowrap;border:1px solid;letter-spacing:.01em;margin-top:2px;min-width:38px;text-align:center}
  .txt{font-size:calc(15.5px * var(--fs));line-height:1.72;color:#332d26;word-break:break-word;white-space:pre-line}
  li.note{grid-template-columns:1fr;color:var(--muted);font-size:calc(13.5px * var(--fs));font-style:normal;
    padding-bottom:3px;border-bottom:1px dotted #ebe4d8;margin-bottom:2px}

  mark{font-weight:700;padding:.5px 2.5px;border-radius:4px;margin:0 .5px;
    box-decoration-break:clone;-webkit-box-decoration-break:clone}
  mark.k-sign{background:var(--sign-bg);color:var(--sign-fg)}
  mark.k-test{background:var(--test-bg);color:var(--test-fg)}

  .empty{text-align:center;color:var(--faint);font-size:calc(15px * var(--fs));padding:56px 20px;
    border:1px dashed #ddd3c2;border-radius:16px;background:rgba(255,253,249,.6)}

  .toast{position:fixed;left:50%;bottom:26px;z-index:60;
    transform:translate(-50%,14px);opacity:0;pointer-events:none;
    background:#2b2620;color:#fff;font-size:calc(13px * var(--fs));line-height:1.5;
    padding:9px 16px;border-radius:999px;text-align:center;max-width:86vw;
    box-shadow:0 12px 32px -14px rgba(0,0,0,.55);
    transition:opacity .25s ease,transform .25s ease}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:#8a2237}

  footer.bottom{max-width:1020px;margin:34px auto 0;padding:0 20px;
    font-size:calc(12.5px * var(--fs));color:var(--faint);line-height:1.9}
  footer.bottom a{color:var(--muted);text-decoration:none;border-bottom:1px solid #ded4c3}
  code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:#eee8dc;
    padding:1px 5px;border-radius:4px;color:#5c5348}

  @media (max-width:560px){
    .wrap{padding:0 12px}
    .top-inner{padding:12px 12px 10px}
    .brand h1{font-size:calc(19px * var(--fs))}
    .tab{padding:8px 14px;font-size:calc(14px * var(--fs))}
    .tab .n{display:none}
    .meta-line{display:none}
    .tools{gap:8px}
    .search{flex:1 1 100%;max-width:none}
    .toggle,.btn-refresh,.btn-size{flex:0 0 auto}
    .day{grid-template-columns:64px 1fr;border-radius:13px}
    .rail{padding:12px 4px}
    .rail .d{font-size:calc(27px * var(--fs))}
    .body{padding:13px}
    .txt{font-size:calc(15.5px * var(--fs))}
    .stat{gap:12px;font-size:calc(12.5px * var(--fs))}
  }
  @media print{
    body{background:#fff;padding:0}
    header.top{position:static;background:#fff;border:0}
    .tools,.tabs,footer.bottom,.toast{display:none}
    .day{break-inside:avoid;box-shadow:none;page-break-inside:avoid}
  }
</style>
</head>

<main class="wrap">

</footer>

/* ---------- 關鍵字標記 ---------- */
const SIGN_WORDS = ["簽改","签改","改簽","改签","簽名","签名","簽","签","改正","批改"];
const TEST_WORDS = ["測驗","测验","小測","小测","大測","大测","測","测","默書","默书","默","評估","评估","統測","统测"];
const TOKEN_RE = new RegExp("(" + SIGN_WORDS.concat(TEST_WORDS).join("|") + ")|([A-Za-z]+)", "g");

function clsOfWord(w){
  if (SIGN_WORDS.includes(w)) return "sign";
  if (TEST_WORDS.includes(w)) return "test";
  const k = w.toLowerCase();
  if (/^(sign|corr|correct|correction)/.test(k)) return "sign";
  if (/^(dict|dictation|quiz|test|tests|exam)/.test(k)) return "test";
  return null;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function markup(text){
  let out = "", last = 0, m, flags = {sign:false, test:false};
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(text)) !== null){
    const word = m[0], kind = m[1] ? clsOfWord(m[1]) : clsOfWord(word);
    if (!kind) continue;
    flags[kind] = true;
    out += esc(text.slice(last, m.index)) + '<mark class="k-' + kind + '">' + esc(word) + '</mark>';
    last = m.index + word.length;
  }
  out += esc(text.slice(last));
  return {html: out, flags};
}

/* ---------- 日期工具 ---------- */
const WEEK = ["週日","週一","週二","週三","週四","週五","週六"];
const p2 = n => String(n).padStart(2, "0");
function parseD(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function today0(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function ymd(d){ return d.getFullYear() + "-" + p2(d.getMonth()+1) + "-" + p2(d.getDate()); }
function mmdd(s){ const d = parseD(s); return p2(d.getMonth()+1) + "-" + p2(d.getDate()); }
function stamp(){
  const d = new Date();
  return ymd(d) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
}
function dueInfo(dueStr){
  if (!dueStr) return null;
  const diff = Math.round((parseD(dueStr) - today0()) / 86400000);
  let label, tone = "";
  if (diff < 0) { label = "已過 " + (-diff) + " 天"; tone = "late"; }
  else if (diff === 0) { label = "今天交"; tone = "soon"; }
  else if (diff === 1) { label = "明天交"; tone = "soon"; }
  else if (diff === 2) { label = "後天交"; }
  else { label = diff + " 天後交"; }
  return {label, tone};
}

/* =========================================================
   網頁內建解析器：直接在瀏覽器抓取學校網頁並解析
   ========================================================= */
const KNOWN_SUBJECTS = new Set(("中|中文|語|语|語文|语文|英|英文|ENG|ENGLISH|數|数|數學|数学|代|代數|代数|" +
  "幾|几|幾何|几何|物|物理|化|化學|化学|生|生物|科|科學|科学|地|地理|歷|历|歷史|历史|" +
  "公|公民|電|电|電腦|电脑|音|音樂|音乐|美|美術|美术|閱|阅|閱讀|阅读|體|体|體育|体育|" +
  "普|普通話|普通话|視|视|視藝|视艺").split("|").map(s => s.toUpperCase()));
const CJK1 = /^[\u4e00-\u9fff]$/;
const CJK_ALPHA = /^[\u4e00-\u9fff]{1,2}[A-Za-z]{1,2}$/;
const ALPHA_ONLY = /^[A-Za-z]{2,10}$/;
const COLON_RE = /^([^:：]{1,8})\s*[:：]\s*([\s\S]+)$/;
const TIGHT_RE = /^([\u4e00-\u9fff]{1,3}[A-Za-z]{0,2})\s*([0-9（(][\s\S]*)$/;

function isSubject(tok){
  const t = String(tok).trim();
  if (!t) return false;
  if (KNOWN_SUBJECTS.has(t.toUpperCase())) return true;
  return CJK1.test(t) || CJK_ALPHA.test(t) || ALPHA_ONLY.test(t);
}

/* 把一格 td 的 HTML 轉成文字行（br / div / p 一律視為換行） */
function cellLines(cell){
  const c = cell.cloneNode(true);
  c.querySelectorAll("br").forEach(b => b.replaceWith("\n"));
  c.querySelectorAll("div,p,li,tr").forEach(el => el.append("\n"));
  return (c.textContent || "")
    .replace(/\r/g, "\n")
    .replace(/[\u00a0\u3000]+/g, " ")
    .split("\n")
    .map(s => s.replace(/[ \t]+/g, " ").trim())
    .filter(Boolean);
}

/* 逐行拆成 {subject, text}；無科目前綴的行視為續行並保留換行 */
function splitItems(lines){
  const items = [];
  lines.forEach(line => {
    let subject = "", text = line;
    const m = line.match(COLON_RE);
    if (m && isSubject(m[1])) { subject = m[1].trim(); text = m[2].trim(); }
    else {
      const m2 = line.match(TIGHT_RE);
      if (m2 && isSubject(m2[1])) { subject = m2[1].trim(); text = m2[2].trim(); }
    }
    const last = items[items.length - 1];
    if (last && !subject) { last.text += "\n" + line; return; }
    if (last && subject && last.subject === subject) { last.text += "\n" + text; return; }
    items.push({ subject, text });
  });
  return items;
}

/* 網頁只有 MM-DD，依學年規則（8 月—翌年 7 月）推算年份 */
function resolveDate(mo, da, today){
  let y = today.getFullYear();
  const tm = today.getMonth() + 1;
  if (tm >= 8 && mo <= 7) y += 1;
  else if (tm <= 7 && mo >= 8) y -= 1;
  const d = new Date(y, mo - 1, da);
  return isNaN(d.getTime()) ? new Date(y, mo - 1, 1) : d;
}
const DSTR = /^(\d{1,2})\s*[-/.]\s*(\d{1,2})$/;

function putDay(bucket, d, due, items){
  const key = ymd(d);
  if (!bucket.has(key)) bucket.set(key, { date: key, due: null, items: [] });
  const b = bucket.get(key);
  if (due && (!b.due || ymd(due) > b.due)) b.due = ymd(due);
  items.forEach(it => {
    if (!b.items.some(o => o.subject === it.subject && o.text === it.text)) b.items.push(it);
  });
}
const sortedDays = bucket => [...bucket.values()].sort((a, b) => a.date < b.date ? 1 : -1);

function parsePage(html, today){
  today = today || new Date();
  const doc = new DOMParser().parseFromString(html, "text/html");
  const bucket = new Map();
  doc.querySelectorAll("tr").forEach(tr => {
    const cells = tr.querySelectorAll("td,th");
    if (cells.length < 4) return;
    const m = (cells[0].textContent || "").trim().match(DSTR);
    if (!m) return;
    const d = resolveDate(+m[1], +m[2], today);
    const dm = (cells[3].textContent || "").trim().match(DSTR);
    let due = dm ? resolveDate(+dm[1], +dm[2], today) : null;
    if (due && due < d) due = new Date(due.getFullYear() + 1, due.getMonth(), due.getDate());

    const items = splitItems(cellLines(cells[2]));
    if (!items.length) return;
    putDay(bucket, d, due, items);
  });
  return sortedDays(bucket);
}

/* 備援來源：r.jina.ai 回傳的 markdown 表格，還原成同樣結構 */
const MD_ROW = /^(\d{1,2})-(\d{1,2})\s+[初高][一二三][A-E]\s*(.*)$/;
/* markdown 會把同一格的多行壓成一行，這裡依「空白＋科目:」重新斷行 */
function mdLines(text){
  return text
    .replace(/\r/g, "")
    .replace(/[ \t\u00a0]+(?=[\u4e00-\u9fffA-Za-z]{1,6}\s*[:：])/g, "\n")
    .split("\n")
    .map(s => s.trim())
    .filter(Boolean);
}
function parseMarkdown(md, today){
  today = today || new Date();
  const lines = String(md).replace(/\r/g, "").split("\n");
  const startAt = lines.findIndex(l => l.indexOf("佈置作業時間") >= 0);
  if (startAt < 0) return [];
  const rows = [];
  let cur = null;
  for (let i = startAt + 1; i < lines.length; i++){
    const raw = lines[i].trim();
    if (!raw) continue;
    const m = raw.match(MD_ROW);
    if (m){
      cur = { mo: +m[1], da: +m[2], buf: m[3] ? [m[3]] : [] };
      rows.push(cur);
    }else if (cur){
      cur.buf.push(raw);
    }
  }
  const bucket = new Map();
  rows.forEach(r => {
    const d = resolveDate(r.mo, r.da, today);
    let text = r.buf.join("\n").trim();
    let due = null;
    const tail = text.match(/(\d{1,2})-(\d{1,2})\s*$/);
    if (tail){
      let cand = new Date(d.getFullYear(), +tail[1] - 1, +tail[2]);
      if (cand < d) cand = new Date(d.getFullYear() + 1, +tail[1] - 1, +tail[2]);
      const diff = Math.round((cand - d) / 86400000);
      if (diff >= 0 && diff <= 21){       // 交作業日期通常很近，避免把頁碼範圍誤認為日期
        due = cand;
        text = text.slice(0, tail.index).replace(/\s+$/, "");
      }
    }
    const items = splitItems(mdLines(text));
    if (items.length) putDay(bucket, d, due, items);
  });
  return sortedDays(bucket);
}

/* ---------- 抓取：直連優先，失敗則多個跨域代理並行競速 ---------- */
const CLASS_META = [
  { code: "s3C", name: "初三C", accent: "#2f6fb0" },
  { code: "s1A", name: "初一A", accent: "#0e8a7d" }
];
const URL_BASE = "https://webservice.pooito.edu.mo/show.php?group=function/homeworks/showworks.php&all=true&&classcode=";

const PROXY_HTML = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.allorigins.win/get?url=" + encodeURIComponent(u)
];
const JINA = u => "https://r.jina.ai/" + u;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function getText(url, timeoutMs, outer){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  if (outer) outer.addEventListener("abort", () => ctrl.abort(), { once: true });
  try{
    const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    let text = await res.text();
    if (/^\s*\{/.test(text)) {                    // allorigins /get 會包成 JSON
      try { const j = JSON.parse(text); if (j && j.contents) text = j.contents; } catch(e){}
    }
    if (!/佈置作業時間|showworks/.test(text)) throw new Error("回傳內容不是作業頁");
    return text;
  }finally{
    clearTimeout(timer);
  }
}

/* 一次嘗試：直連、HTML 代理、markdown 代理同時進行，先拿到可用資料者為準 */
async function loadDaysOnce(url){
  const ctrl = new AbortController();
  const today = new Date();
  const tasks = [];

  const viaHtml = async (target, ms) => {
    const days = parsePage(await getText(target, ms, ctrl.signal), today);
    if (!days.length) throw new Error("空資料");
    return days;
  };

  tasks.push(viaHtml(url, 5000));                                     // 直連
  PROXY_HTML.forEach(f => tasks.push(viaHtml(f(url), 14000)));        // HTML 代理
  tasks.push((async () => {                                           // markdown 代理
    const days = parseMarkdown(await getText(JINA(url), 22000, ctrl.signal), today);
    if (!days.length) throw new Error("空資料");
    return days;
  })());

  try{
    const days = await Promise.any(tasks);
    ctrl.abort();
    return days;
  }catch(e){
    ctrl.abort();
    throw new Error("連線失敗");
  }
}

/* 全部通道失敗時，稍等再試一次 */
async function fetchPage(url){
  try { return await loadDaysOnce(url); }
  catch(e){
    await sleep(900);
    try { return await loadDaysOnce(url); }
    catch(e2){ throw new Error("無法取得作業資料"); }
  }
}

/* ---------- 狀態 ---------- */
const state = { cls: 0, q: "", only: false, busy: false };
const currentClass = () => DATA.classes[state.cls];
function activeTime(){

  return (c && (c.fetchedAt || DATA.generatedAt)) || "—";
}

function toast(msg, isErr){
  const el = document.getElementById("toast");

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = DATA.classes.map((c, i) => `
    <button class="tab" role="tab" aria-selected="${i === state.cls}" data-i="${i}">
      <span class="dot" style="color:${c.accent}"></span>${esc(c.name)}

function matchItems(day, nq, only){
  return day.items.filter(it => {
    if (nq && !norm(it.subject + ":" + it.text).includes(nq)) return false;
    if (only){
      const r = markup(it.text);
      if (!r.flags.sign && !r.flags.test) return false;
    }
    return true;
  });
}

function renderList(){
  const c = currentClass();
  const nq = norm(state.q.trim());
  const list = document.getElementById("list");

  document.getElementById("updated").textContent = "資料時間 " + activeTime() + " · 開啟即自動更新";

  const days = c.days
    .map(d => ({ ...d, shown: matchItems(d, nq, state.only) }))
    .filter(d => d.shown.length > 0);

  document.getElementById("subtitle").innerHTML =
    `<b>${esc(c.name)}</b> · ${c.days.length} 天紀錄` +
    (state.q || state.only ? ` · 篩選後 ${days.length} 天` : "");

  if (!days.length){
    list.innerHTML = `<div class="empty">沒有符合條件的作業紀錄<br>試試清除搜尋或關閉篩選</div>`;
    document.getElementById("stat").innerHTML = "";
    return;
  }

  const t0 = today0();
  let html = "";
  days.forEach((d, idx) => {
    const dt = parseD(d.date);
    const due = dueInfo(d.due);
    let signN = 0, testN = 0;
    const rows = d.shown.map(it => {
      const r = markup(it.text);
      if (r.flags.sign) signN++;
      if (r.flags.test) testN++;
      if (!it.subject) return `<li class="note">${r.html}</li>`;
      const col = subjColor(it.subject);
      return `<li><span class="subj" style="color:${col};border-color:${col}55;background:${col}12">${esc(it.subject)}</span>` +
             `<span class="txt">${r.html}</span></li>`;
    }).join("");

    html += `<article class="day" style="animation-delay:${Math.min(idx * 18, 220)}ms">
      <div class="rail">
        <div class="m">${dt.getMonth() + 1} 月</div>
        <div class="d">${p2(dt.getDate())}</div>
        <div class="w">${WEEK[dt.getDay()]}</div>
        ${dt.getTime() === t0.getTime() ? '<div class="today">今天</div>' : ""}
      </div>
      <div class="body">
        <div class="hd">
          <h2>${dt.getMonth() + 1} 月 ${dt.getDate()} 日 · ${WEEK[dt.getDay()]}</h2>
          ${signN ? `<span class="chip sign">簽改 ${signN}</span>` : ""}
          ${testN ? `<span class="chip test">測驗 ${testN}</span>` : ""}
          ${d.due ? `<span class="chip due ${due.tone}">交 ${mmdd(d.due)} · ${due.label}</span>` : ""}
        </div>
        <ul class="items">${rows}</ul>
      </div>
    </article>`;
  });
  list.innerHTML = html;

  const totalItems = days.reduce((n, d) => n + d.shown.length, 0);
  const signDays = days.filter(d => d.shown.some(it => markup(it.text).flags.sign)).length;
  const testDays = days.filter(d => d.shown.some(it => markup(it.text).flags.test)).length;
  document.getElementById("stat").innerHTML =
    `<span class="k">顯示 <b>${days.length}</b> 天 · <b>${totalItems}</b> 項作業</span>` +
    `<span class="k"><span class="sw" style="background:var(--sign-bg);border:1px solid #e8cd9a"></span>含簽改 <b>${signDays}</b> 天</span>` +
    `<span class="k"><span class="sw" style="background:var(--test-bg);border:1px solid #eeb9c6"></span>含測驗 <b>${testDays}</b> 天</span>`;
}

/* ---------- 抓取／更新 ---------- */
function setBusyUI(on){
  const btn = document.getElementById("refresh");
  if (btn){ btn.classList.toggle("busy", on); btn.disabled = on; }
}
function setMeta(txt){
  const el = document.getElementById("updated");
  if (el) el.textContent = txt;
}

async function refresh(opts){
  opts = opts || {};
  if (state.busy || !DATA || !DATA.classes || !DATA.classes.length) return;
  state.busy = true;
  setBusyUI(true);
  setMeta("正在抓取最新作業…");

  // 逐班獨立更新：哪一班先拿到就先顯示，不必等另一班
  const jobs = DATA.classes.map((c, idx) => (async () => {
    if (idx) await sleep(idx * 350);
    try{
      const days = await fetchPage(c.url || URL_BASE + c.code);
      const target = DATA.classes.find(x => x.code === c.code) || c;
      target.days = days;
      target.fetchedAt = stamp();
      DATA.generatedAt = target.fetchedAt;
      saveCache(DATA);
      renderTabs();
      renderList();
      return { name: c.name, ok: true, n: days.length };
    }catch(err){
      return { name: c.name, ok: false, err: (err && err.message) || "網絡問題" };
    }
  })());

  const results = await Promise.all(jobs);
  state.busy = false;
  setBusyUI(false);

  const bad = results.filter(r => !r.ok);
  const hasAny = DATA.classes.some(c => c.days && c.days.length);

  if (bad.length === results.length && !hasAny){
    setMeta("抓取失敗");
    toast("無法取得資料：" + bad[0].err + "。請檢查網絡後按「更新」重試。", true);
    return;
  }

  if (bad.length){
    if (opts.silent) setMeta("未能更新（" + bad.map(b => b.name).join("、") + "），顯示 " + activeTime() + " 的資料");
    else toast("部分班別抓取失敗（" + bad.map(b => b.name).join("、") + "），已保留原有資料", true);
  }else if (!opts.silent){
    toast("已更新：" + results.map(r => r.name + " " + r.n + " 天").join("、"));
  }
}

/* ---------- 初始化：每次開啟即時抓取 ---------- */
(function init(){
  const list = document.getElementById("list");
  const btn = document.getElementById("refresh");

  // 字級：沿用上次選擇
  let fsStep = 0;
  try{ fsStep = parseInt(localStorage.getItem("hw_fs") || "0", 10) || 0; }catch(e){}
  fsStep = applyFontSize(fsStep);
  document.getElementById("fsBtn").onclick = () => {
    fsStep = applyFontSize((fsStep + 1) % FS_STEPS.length);
  };

  // 先用上次成功抓取的快取（若有），沒有就用內嵌快照，最後才向學校網址抓
  const cache = loadCache();
  if (cache && (!DATA || !DATA.generatedAt || cache.generatedAt > DATA.generatedAt)) DATA = cache;

  let cold = false;
  if (!DATA || !DATA.classes || !DATA.classes.length){
    cold = true;
    DATA = { generatedAt: "", classes: CLASS_META.map(m => ({ ...m, url: URL_BASE + m.code, days: [] })) };
  }

  const hash = location.hash.replace("#", "");
  const i = DATA.classes.findIndex(c => c.code === hash);
  if (i >= 0) state.cls = i;

  document.getElementById("sources").innerHTML = DATA.classes.map(c =>
    `<div>${esc(c.name)}：<a href="${c.url || URL_BASE + c.code}" target="_blank" rel="noopener">作業佈置原始頁面</a></div>`
  ).join("");

  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.q = q.value; renderList(); });
  const only = document.getElementById("onlyFlags");
  only.addEventListener("change", () => { state.only = only.checked; renderList(); });
  btn.onclick = () => refresh({ silent: false });

  if (DATA.classes[state.cls].days.length){
    renderTabs();
    renderList();
  }else{
    document.getElementById("tabs").innerHTML = "";
    document.getElementById("stat").innerHTML = "";
    list.innerHTML = '<div class="empty">正在抓取作業資料…<br>' +
                     '<span style="font-size:12px;opacity:.75">首次載入需時數秒</span></div>';
  }

  // 開啟即抓；有舊資料時靜默更新，失敗只在右上角提示
  refresh({ silent: !cold });
})();
</script>
